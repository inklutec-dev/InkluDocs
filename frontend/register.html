<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkluDocs - Registrierung</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <a href="#main" class="skip-link">Zum Hauptinhalt springen</a>
    <main id="main" tabindex="-1">
        <div class="auth-container" role="region" aria-label="Registrierung">
            <h1><span class="brand">Inklu</span>Docs</h1>
            <p class="subtitle">Neues Konto erstellen</p>
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="display_name">Name</label>
                    <input type="text" id="display_name" name="display_name" required autocomplete="name" autofocus>
                </div>
                <div class="form-group">
                    <label for="email">E-Mail-Adresse</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="password">Passwort (mind. 8 Zeichen)</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
                </div>
                <div class="form-group">
                    <label for="password2">Passwort wiederholen</label>
                    <input type="password" id="password2" name="password2" required autocomplete="new-password">
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="acceptTerms" name="acceptTerms" required>
                    <label for="acceptTerms">Ich akzeptiere die <a href="/nutzungsbedingungen" target="_blank">Nutzungsbedingungen</a> und die <a href="/datenschutz" target="_blank">Datenschutzerklärung</a>.</label>
                </div>
                <button type="submit" class="btn-full">Konto erstellen</button>
                <div id="errorMsg" class="error-message" role="alert" aria-live="polite"></div>
            </form>
            <div class="auth-links center">
                <a href="/">Bereits ein Konto? Anmelden</a>
            </div>
        </div>
        <footer class="legal-footer" role="contentinfo">
            <a href="/impressum">Impressum</a> |
            <a href="/datenschutz">Datenschutz</a> |
            <a href="/nutzungsbedingungen">Nutzungsbedingungen</a>
        </footer>
    </main>
    <script>
        const form = document.getElementById('registerForm');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = '';

            const display_name = document.getElementById('display_name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const password2 = document.getElementById('password2').value;

            if (!display_name || !email || !password) {
                errorMsg.textContent = 'Bitte alle Felder ausfuellen.';
                return;
            }
            if (!document.getElementById('acceptTerms').checked) {
                errorMsg.textContent = 'Bitte akzeptieren Sie die Nutzungsbedingungen und Datenschutzerklärung.';
                return;
            }
            if (password.length < 8) {
                errorMsg.textContent = 'Passwort muss mindestens 8 Zeichen lang sein.';
                return;
            }
            if (password !== password2) {
                errorMsg.textContent = 'Passwoerter stimmen nicht ueberein.';
                return;
            }
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ display_name, email, password }),
                });
                const data = await res.json();
                if (res.ok) {
                    // Show verification message instead of redirect
                    document.querySelector('.auth-container').innerHTML = `
                        <h1><span class="brand">Inklu</span>Docs</h1>
                        <div role="status" aria-live="polite" style="margin:2rem 0;">
                            <p style="font-size:1.2rem;color:#16a34a;font-weight:600;">Fast geschafft!</p>
                            <p style="margin:1rem 0;">Wir haben eine Bestaetigungsmail an <strong>${email}</strong> gesendet.</p>
                            <p>Bitte klicken Sie auf den Link in der E-Mail, um Ihr Konto zu aktivieren.</p>
                            <p style="color:#64748b;font-size:0.9rem;margin-top:1.5rem;">Keine E-Mail erhalten? Pruefen Sie Ihren Spam-Ordner oder
                            <button type="button" id="resendBtn" style="background:none;border:none;color:#e87722;text-decoration:underline;cursor:pointer;font-size:0.9rem;padding:0;">fordern Sie einen neuen Link an</button>.</p>
                        </div>
                        <p><a href="/">Zur Anmeldung</a></p>
                    `;
                    const resendBtn = document.getElementById('resendBtn');
                    if (resendBtn) {
                        resendBtn.addEventListener('click', async () => {
                            resendBtn.disabled = true;
                            resendBtn.textContent = 'Wird gesendet...';
                            try {
                                await fetch('/api/resend-verification', {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ email }),
                                });
                                resendBtn.textContent = 'Neuer Link gesendet!';
                            } catch (e) {
                                resendBtn.textContent = 'Fehler – bitte erneut versuchen';
                                resendBtn.disabled = false;
                            }
                        });
                    }
                } else {
                    errorMsg.textContent = data.detail || 'Registrierung fehlgeschlagen.';
                }
            } catch (err) {
                errorMsg.textContent = 'Verbindungsfehler. Bitte erneut versuchen.';
            }
        });
    </script>
</body>
</html>
