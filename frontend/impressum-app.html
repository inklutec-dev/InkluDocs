<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkluDocs - Impressum</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
<a href="#main" class="dash-skip">Zum Hauptinhalt springen</a>
<div class="app-shell">
  <div class="app-sidebar" id="appSidebar"></div>
  <div class="app-content">
    <main id="main" class="dash-main" tabindex="-1">
      <h1>Impressum</h1>
      <p class="dash-sub">Inhalt aus
        <a href="/impressum">dem öffentlichen Impressum</a> — eine Quelle, kein Doppeltext.</p>
      <div id="legalContent" aria-busy="true" role="region" aria-label="Impressum">
        <p class="dash-sub">Inhalt wird geladen …</p>
      </div>
    </main>
    <footer class="dash-footer"></footer>
  </div>
</div>

<div class="sr-only" role="status" aria-live="polite" id="liveRegion"></div>

<script src="/static/dashboard.js"></script>
<script>
  // Steve 08.06.2026: Single Source of Truth — lade das öffentliche /impressum,
  // extrahiere den .legal-container und rendere ihn in den Dashboard-Rahmen.
  // So bleibt die Sidebar sichtbar und der Impressum-Text wird nicht doppelt
  // gepflegt. Verhält sich exakt wie /datensicherheit (Vorbild).
  (async function loadImpressumInline() {
    const target = document.getElementById('legalContent');
    try {
      const res = await fetch('/impressum', { credentials: 'same-origin' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const container = doc.querySelector('.legal-container');
      if (!container) throw new Error('Impressum-Inhalt nicht gefunden (.legal-container fehlt)');
      // Die public Seite hat eine eigene H1 "InkluDocs" und Subtitle "Impressum"
      // — die brauchen wir hier nicht doppelt (H1 ist oben im Dashboard-Rahmen).
      container.querySelectorAll('h1').forEach((h) => h.remove());
      // Den "rechtliche Seiten"-Subfooter aus der eingebetteten Variante entfernen —
      // die Dashboard-Footer-Leiste hat schon ihre eigenen Links.
      container.querySelectorAll('nav.auth-links').forEach((n) => n.remove());
      target.innerHTML = '';
      target.appendChild(container);
      target.setAttribute('aria-busy', 'false');
    } catch (err) {
      target.innerHTML = '<p style="color:var(--error,#c33);">Impressum konnte nicht geladen werden: '
        + (err && err.message ? err.message : 'Unbekannter Fehler')
        + '. Bitte stattdessen das <a href="/impressum">öffentliche Impressum</a> aufrufen.</p>';
      target.setAttribute('aria-busy', 'false');
    }
  })();
</script>
</body>
</html>
