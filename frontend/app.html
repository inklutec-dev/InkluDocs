<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkluDocs</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <div class="header-brand">
            <img src="/static/inklutec-logo.png" alt="INKLUTEC Logo" class="header-logo">
            <h1><span class="brand">Inklu</span>Docs</h1>
        </div>
        <div class="header-actions">
            <span id="userGreeting" style="color:rgba(255,255,255,0.85);font-size:0.95rem;margin-right:0.75rem;white-space:nowrap;" aria-label="Angemeldeter Benutzer"></span>
            <button id="adminBtn" class="header-btn" style="display:none" aria-label="Benutzerverwaltung">Benutzer</button>
            <button id="settingsBtn" class="header-btn" aria-label="Einstellungen">Einstellungen</button>
            <button id="logoutBtn" class="header-btn" aria-label="Abmelden">Abmelden</button>
        </div>
    </header>

    <main id="mainContent" class="main-content"></main>

    <footer class="legal-footer" role="contentinfo" style="padding-bottom:2rem;">
        <a href="/impressum">Impressum</a> |
        <a href="/datenschutz">Datenschutz</a> |
        <a href="/nutzungsbedingungen">Nutzungsbedingungen</a>
    </footer>

    <div id="liveRegion" class="sr-only" aria-live="polite" role="status"></div>

    <script>
    const main = document.getElementById('mainContent');
    const liveRegion = document.getElementById('liveRegion');
    let currentUser = null;
    let pollInterval = null;

    function announce(msg) {
        liveRegion.textContent = '';
        setTimeout(() => { liveRegion.textContent = msg; }, 100);
    }

    // ─── Init ────────────────────────────────────────
    async function init() {
        const res = await fetch('/api/me');
        if (res.status === 401) { window.location.href = '/'; return; }
        currentUser = (await res.json()).user;
        document.getElementById('userGreeting').textContent = 'Hallo, ' + currentUser.display_name;
        if (currentUser.is_admin) {
            document.getElementById('adminBtn').style.display = '';
        }
        showDashboard();
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = '/';
    });
    document.getElementById('adminBtn').addEventListener('click', () => showAdmin());
    document.getElementById('settingsBtn').addEventListener('click', () => showSettings());

    // ─── Dashboard ───────────────────────────────────
    async function showDashboard() {
        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        highlightNav(null);
        const res = await fetch('/api/projects');
        if (res.status === 401) { window.location.href = '/'; return; }
        const data = await res.json();

        main.innerHTML = `
            <div class="upload-area" role="region" aria-label="Dateien hochladen oder Website scannen">
                <h2>Alt-Texte generieren</h2>
                <p>Laden Sie PDFs oder Bilder hoch, um Alt-Texte fuer alle enthaltenen Grafiken zu generieren.</p>
                <label class="upload-btn" for="fileInput" role="button" tabindex="0">Dateien auswaehlen</label>
                <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.gif,.svg,.webp,.heic,.heif,.bmp,.tiff,.tif" multiple aria-label="PDF oder Bilddateien auswaehlen">
                <p id="uploadStatus" aria-live="polite" style="margin-top:1rem;"></p>
                <div class="url-scan-area" style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border,#ddd);">
                    <label for="urlInput" style="display:block;font-weight:600;margin-bottom:0.5rem;">Oder Website-URL eingeben</label>
                    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                        <input type="url" id="urlInput" placeholder="https://example.com" style="flex:1;min-width:200px;padding:0.6rem;border:1px solid var(--border,#ccc);border-radius:4px;font-size:1rem;" aria-describedby="urlHint">
                        <button class="btn btn-primary" id="scanBtn" onclick="scanUrl()" style="min-width:120px;">Website scannen</button>
                    </div>
                    <small id="urlHint" style="color:var(--text-muted,#666);display:block;margin-top:0.3rem;">Die Seite wird analysiert und alle Bilder ohne oder mit fehlenden Alt-Texten werden gefunden.</small>
                </div>
            </div>
            <h2 class="section-title">Meine Projekte</h2>
            <div id="projectList"></div>
        `;

        document.getElementById('fileInput').addEventListener('change', handleUpload);
        document.getElementById('urlInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); scanUrl(); }
        });
        renderProjectList(data.projects);
    }

    async function handleUpload(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        const status = document.getElementById('uploadStatus');

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            status.textContent = files.length > 1
                ? 'Datei ' + (i + 1) + ' von ' + files.length + ' wird hochgeladen...'
                : 'Wird hochgeladen...';
            announce(file.name + ' wird hochgeladen');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    if (i === files.length - 1) {
                        announce(data.total_images + ' Bilder gefunden.');
                        showProject(data.project_id);
                    }
                } else {
                    status.textContent = 'Fehler: ' + (data.detail || 'Upload fehlgeschlagen');
                    announce('Fehler beim Upload von ' + file.name);
                    return;
                }
            } catch (err) {
                status.textContent = 'Verbindungsfehler';
                return;
            }
        }
    }

    async function scanUrl() {
        const input = document.getElementById('urlInput');
        const btn = document.getElementById('scanBtn');
        const status = document.getElementById('uploadStatus');
        const url = input.value.trim();

        if (!url) { input.focus(); return; }
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            status.textContent = 'Bitte eine vollstaendige URL eingeben (mit https://)';
            announce('Bitte eine vollstaendige URL eingeben');
            input.focus();
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Wird gescannt...';
        status.textContent = 'Website wird analysiert...';
        announce('Website wird gescannt: ' + url);

        try {
            const res = await fetch('/api/scan-url', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url }),
            });
            const data = await res.json();
            if (res.ok) {
                announce(data.total_images + ' Bilder auf der Seite gefunden.');
                showProject(data.project_id);
            } else {
                status.textContent = 'Fehler: ' + (data.detail || 'Scan fehlgeschlagen');
                announce('Fehler beim Scannen der Website');
            }
        } catch (err) {
            status.textContent = 'Verbindungsfehler';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Website scannen';
        }
    }

    function renderProjectList(projects) {
        const list = document.getElementById('projectList');
        if (!projects.length) {
            list.innerHTML = '<div class="empty-state"><p>Noch keine Projekte. Laden Sie Dateien hoch oder scannen Sie eine Website.</p></div>';
            return;
        }
        const statusLabels = { uploaded:'Hochgeladen', extracting:'Extrahiere...', extracted:'Bereit', processing:'Verarbeite...', done:'Fertig', error:'Fehler' };
        const statusClass = s => s === 'done' ? 'badge-done' : s === 'processing' ? 'badge-processing' : s === 'extracted' ? 'badge-ready' : 'badge-error';
        const typeLabels = { pdf:'PDF', images:'Bilder', url:'Website' };

        list.innerHTML = projects.map(p => {
            const progress = p.total_images > 0 ? Math.round((p.processed_images / p.total_images) * 100) : 0;
            const typeLabel = typeLabels[p.project_type] || 'PDF';
            return `
            <div class="card" role="article" aria-label="Projekt ${p.filename}">
                <div class="card-header">
                    <span class="card-name">${p.filename}</span>
                    <span class="badge" style="background:var(--text-muted,#888);color:#fff;padding:0.15rem 0.5rem;border-radius:4px;font-size:0.8rem;">${typeLabel}</span>
                    <span class="badge ${statusClass(p.status)}">${statusLabels[p.status] || p.status}</span>
                </div>
                <div class="card-info">${p.total_images} Bilder | ${p.processed_images} verarbeitet | ${new Date(p.created_at).toLocaleDateString('de-DE')}</div>
                ${p.status === 'processing' ? `<div class="progress-bar" role="progressbar" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${progress}%"></div></div>` : ''}
                <div class="card-actions">
                    <button class="btn btn-primary" onclick="showProject(${p.id})">Oeffnen</button>
                    <button class="btn btn-danger btn-small" onclick="deleteProject(${p.id}, '${p.filename}')">Loeschen</button>
                </div>
            </div>`;
        }).join('');
    }

    async function deleteProject(id, name) {
        if (!confirm('Projekt "' + name + '" und alle Daten wirklich loeschen?')) return;
        await fetch('/api/projects/' + id, { method: 'DELETE' });
        announce('Projekt geloescht');
        showDashboard();
    }

    // ─── Project Detail ──────────────────────────────
    async function showProject(projectId) {
        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        highlightNav(null);

        const res = await fetch('/api/projects/' + projectId);
        if (res.status === 401) { window.location.href = '/'; return; }
        const data = await res.json();
        const project = data.project;
        const images = data.images;

        const statusLabels = { extracted:'Bereit zur Verarbeitung', processing:'Alt-Texte werden generiert...', done:'Fertig', error:'Fehler' };
        const statusClass = project.status === 'done' ? 'badge-done' : project.status === 'processing' ? 'badge-processing' : 'badge-ready';
        const progress = project.total_images > 0 ? Math.round((project.processed_images / project.total_images) * 100) : 0;

        main.innerHTML = `
            <button class="back-btn" onclick="showDashboard()">Zurueck zur Uebersicht</button>
            <div class="card">
                <div class="card-header">
                    <span class="card-name">${project.filename}</span>
                    <span class="badge ${statusClass}">${statusLabels[project.status] || project.status}</span>
                </div>
                <div class="card-info">${project.total_images} Bilder | ${project.processed_images} verarbeitet</div>
                ${project.status === 'processing' ? `
                    <div class="progress-bar" role="progressbar" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100" aria-label="Fortschritt: ${progress} Prozent">
                        <div class="progress-fill" style="width:${progress}%"></div>
                    </div>
                    <p id="processingInfo" aria-live="polite">Bild ${project.processed_images} von ${project.total_images} wird verarbeitet.</p>
                ` : ''}
                <div class="card-actions">
                    ${project.status === 'extracted' ? '<button class="btn btn-primary" id="generateBtn" onclick="startGeneration(' + project.id + ')">Alt-Texte generieren</button>' : ''}
                    ${project.status === 'done' ? `
                        <button class="btn btn-primary" id="exportOpenBtn" onclick="openExportPanel(${project.id}, '${project.filename}')">Exportieren</button>
                        <div id="exportPanel" style="display:none;margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;" role="region" aria-label="Export-Optionen">
                            <div class="form-group" style="margin-bottom:0.8rem;">
                                <label for="exportFilename" style="display:block;font-weight:600;margin-bottom:0.3rem;">Dateiname</label>
                                <input type="text" id="exportFilename" style="width:100%;padding:0.5rem;border:1px solid var(--border);border-radius:4px;font-size:0.95rem;">
                            </div>
                            <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                                <button class="btn btn-primary" onclick="doExport(${project.id}, 'xlsx')">Als Excel</button>
                                <button class="btn btn-primary" onclick="doExport(${project.id}, 'json')">Als JSON</button>
                                <button class="btn btn-secondary" onclick="doExport(${project.id}, 'csv')">Als CSV</button>
                                <button class="btn btn-secondary" onclick="doExport(${project.id}, 'pdf')">Als PDF (Beta)</button>
                                <button class="btn btn-secondary" onclick="closeExportPanel()">Abbrechen</button>
                            </div>
                            <span id="exportStatus" role="status" aria-live="polite" style="display:block;margin-top:0.5rem;"></span>
                        </div>
                    ` : ''}
                </div>
            </div>
            <h2 class="section-title" style="margin-top:1.5rem">Bilder (${images.length})</h2>
            <div id="imageList"></div>
        `;

        renderImages(images, projectId);

        if (project.status === 'processing') {
            pollInterval = setInterval(async () => {
                const sRes = await fetch('/api/projects/' + projectId + '/status');
                const sData = await sRes.json();
                if (sData.status === 'done' || sData.status === 'error') {
                    clearInterval(pollInterval); pollInterval = null;
                    announce(sData.status === 'done' ? 'Alle Alt-Texte wurden generiert.' : 'Fehler bei der Verarbeitung.');
                    showProject(projectId);
                } else if (sData.processed_images > project.processed_images) {
                    showProject(projectId);
                } else {
                    const bar = document.querySelector('.progress-fill');
                    const info = document.getElementById('processingInfo');
                    const newP = Math.round((sData.processed_images / sData.total_images) * 100);
                    if (bar) bar.style.width = newP + '%';
                    if (info) info.textContent = 'Bild ' + sData.processed_images + ' von ' + sData.total_images + ' wird verarbeitet.';
                }
            }, 10000);
        }
    }

    function renderImages(images, projectId) {
        const list = document.getElementById('imageList');
        if (!images.length) {
            list.innerHTML = '<div class="empty-state"><p>Keine Bilder gefunden.</p></div>';
            return;
        }
        const imageTypes = ['foto','diagramm','karte','logo','tabelle','screenshot','infografik','dekorativ'];
        const complexTypes = ['diagramm','karte','tabelle','infografik'];

        list.innerHTML = images.map(img => {
            const hasLang = img.langbeschreibung && img.langbeschreibung.trim();
            return `
            <div class="image-review" role="region" aria-label="Bild ${img.image_index}${img.page_number > 0 ? ', Seite ' + img.page_number : ''}">
                <div class="image-review-header">
                    <span class="image-meta">${img.page_number > 0 ? 'Seite ' + img.page_number + ', ' : ''}Bild ${img.image_index} (${img.width}x${img.height}px)</span>
                    ${img.image_type && img.image_type !== 'unknown' ? '<span class="image-type-badge">' + img.image_type + '</span>' : ''}
                    ${img.konfidenz && img.status === 'done' ? '<span class="badge" style="background:' + (img.konfidenz === 'hoch' ? 'var(--success,#2a7)' : img.konfidenz === 'niedrig' ? 'var(--error,#c33)' : '#e90') + ';color:#fff;padding:0.15rem 0.5rem;border-radius:4px;font-size:0.8rem;">Konfidenz: ' + img.konfidenz + '</span>' : ''}
                    ${img.original_alt ? '<span class="badge" style="background:#666;color:#fff;padding:0.15rem 0.5rem;border-radius:4px;font-size:0.8rem;">Original vorhanden</span>' : ''}
                    ${img.status === 'processing' ? '<span class="badge badge-processing">Wird analysiert...</span>' : ''}
                </div>
                <img src="/api/images/${img.id}/file" alt="Extrahiertes Bild${img.page_number > 0 ? ' von Seite ' + img.page_number : ''}" class="image-preview" loading="lazy">
                ${img.original_alt ? '<div style="margin-bottom:0.8rem;padding:0.6rem;background:var(--bg-card,#f5f5f5);border-left:3px solid #666;border-radius:0 4px 4px 0;"><span style="font-weight:600;font-size:0.85rem;color:var(--text-muted,#666);">Originaler Alt-Text:</span><p style="margin:0.3rem 0 0;font-size:0.95rem;">' + img.original_alt.replace(/</g, '&lt;') + '</p></div>' : ''}
                <label for="alttext_${img.id}" style="display:block;font-weight:600;margin-bottom:0.3rem;">
                    Alt-Text
                    <span class="save-indicator" id="saved_${img.id}">Gespeichert</span>
                </label>
                <textarea class="alt-text-field" id="alttext_${img.id}" data-image-id="${img.id}"
                    placeholder="${img.status === 'done' ? '' : 'Alt-Text wird generiert...'}"
                    ${img.status !== 'done' && !img.alt_text ? 'disabled' : ''}
                >${img.alt_text_edited || img.alt_text || ''}</textarea>
                <div id="langcontainer_${img.id}">
                ${hasLang ? `
                    <label for="langtext_${img.id}" style="display:block;font-weight:600;margin-top:0.8rem;margin-bottom:0.3rem;">Langbeschreibung</label>
                    <textarea class="alt-text-field langtext-field" id="langtext_${img.id}" style="min-height:80px;">${img.langbeschreibung}</textarea>
                ` : ''}
                </div>
                ${img.status === 'done' ? `
                    <div class="regen-area" style="margin-top:0.8rem;display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                        <label for="regen_type_${img.id}" class="sr-only">Bildtyp fuer Neugenerierung</label>
                        <select id="regen_type_${img.id}" style="padding:0.4rem;border:1px solid var(--border,#ccc);border-radius:4px;font-size:0.9rem;">
                            <option value="">Automatisch</option>
                            ${imageTypes.map(t => '<option value="' + t + '"' + (img.image_type === t ? ' selected' : '') + '>' + t.charAt(0).toUpperCase() + t.slice(1) + '</option>').join('')}
                        </select>
                        <button class="btn btn-secondary btn-small" onclick="regenerateImage(${projectId}, ${img.id})" id="regen_btn_${img.id}">Neu generieren</button>
                        ${complexTypes.includes(img.image_type) && !hasLang ? '<button class="btn btn-secondary btn-small" onclick="generateLongDesc(' + projectId + ', ' + img.id + ')" id="longdesc_btn_' + img.id + '">Langbeschreibung (optional)</button>' : ''}
                        <span id="regen_status_${img.id}" role="status" aria-live="polite" style="font-size:0.85rem;"></span>
                    </div>
                ` : ''}
            </div>`;
        }).join('');

        // Auto-save alt-text on edit
        document.querySelectorAll('.alt-text-field:not(.langtext-field)').forEach(ta => {
            let timeout;
            ta.addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(async () => {
                    const id = ta.dataset.imageId;
                    await fetch('/api/images/' + id + '/alt-text', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ alt_text: ta.value }),
                    });
                    const ind = document.getElementById('saved_' + id);
                    if (ind) { ind.classList.add('visible'); setTimeout(() => ind.classList.remove('visible'), 2000); }
                }, 800);
            });
        });
    }

    async function regenerateImage(projectId, imageId) {
        const typeSelect = document.getElementById('regen_type_' + imageId);
        const btn = document.getElementById('regen_btn_' + imageId);
        const statusEl = document.getElementById('regen_status_' + imageId);
        const imageType = typeSelect ? typeSelect.value : '';

        btn.disabled = true;
        btn.textContent = 'Generiere...';
        if (statusEl) statusEl.textContent = '';
        announce('Alt-Text wird neu generiert');

        try {
            const body = {};
            if (imageType) body.image_type = imageType;

            const res = await fetch('/api/projects/' + projectId + '/regenerate/' + imageId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const data = await res.json();
            if (res.ok) {
                const ta = document.getElementById('alttext_' + imageId);
                if (ta) ta.value = data.alt_text || '';
                if (data.langbeschreibung) {
                    const lt = document.getElementById('langtext_' + imageId);
                    if (lt) lt.value = data.langbeschreibung;
                }
                if (statusEl) statusEl.textContent = 'Neu generiert (' + (data.konfidenz || 'mittel') + ')';
                announce('Alt-Text wurde neu generiert');
            } else {
                if (statusEl) statusEl.textContent = 'Fehler';
                announce('Fehler bei der Neugenerierung');
            }
        } catch (err) {
            if (statusEl) statusEl.textContent = 'Verbindungsfehler';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Neu generieren';
        }
    }

    async function generateLongDesc(projectId, imageId) {
        const btn = document.getElementById('longdesc_btn_' + imageId);
        const statusEl = document.getElementById('regen_status_' + imageId);
        const typeSelect = document.getElementById('regen_type_' + imageId);
        const imageType = typeSelect ? typeSelect.value : '';

        if (btn) { btn.disabled = true; btn.textContent = 'Generiere...'; }
        if (statusEl) statusEl.textContent = '';
        announce('Langbeschreibung wird generiert');

        try {
            const body = { image_type: imageType || undefined, long_description: true };
            const res = await fetch('/api/projects/' + projectId + '/regenerate/' + imageId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const data = await res.json();
            if (res.ok && data.langbeschreibung) {
                const container = document.getElementById('langcontainer_' + imageId);
                if (container) {
                    container.innerHTML = '<label for="langtext_' + imageId + '" style="display:block;font-weight:600;margin-top:0.8rem;margin-bottom:0.3rem;">Langbeschreibung</label><textarea class="alt-text-field langtext-field" id="langtext_' + imageId + '" style="min-height:80px;">' + (data.langbeschreibung || '') + '</textarea>';
                }
                // Also update alt-text if improved
                if (data.alt_text) {
                    const ta = document.getElementById('alttext_' + imageId);
                    if (ta) ta.value = data.alt_text;
                }
                if (btn) btn.style.display = 'none';
                if (statusEl) statusEl.textContent = 'Langbeschreibung generiert';
                announce('Langbeschreibung wurde generiert');
            } else {
                if (statusEl) statusEl.textContent = 'Keine Langbeschreibung verfuegbar';
                announce('Keine Langbeschreibung verfuegbar');
            }
        } catch (err) {
            if (statusEl) statusEl.textContent = 'Verbindungsfehler';
        } finally {
            if (btn) { btn.disabled = false; btn.textContent = 'Langbeschreibung (optional)'; }
        }
    }

    async function startGeneration(projectId) {
        const btn = document.getElementById('generateBtn');
        if (btn) { btn.disabled = true; btn.textContent = 'Wird gestartet...'; }
        announce('Alt-Text-Generierung wird gestartet.');
        const res = await fetch('/api/projects/' + projectId + '/generate', { method: 'POST' });
        if (res.ok) { showProject(projectId); }
        else { const d = await res.json(); announce('Fehler: ' + (d.detail || '')); }
    }

    // ─── Export ──────────────────────────────────────
    function openExportPanel(projectId, filename) {
        const panel = document.getElementById('exportPanel');
        const btn = document.getElementById('exportOpenBtn');
        const input = document.getElementById('exportFilename');
        if (panel && input) {
            input.value = filename.replace(/\.[^.]+$/, '');
            panel.style.display = 'block';
            if (btn) btn.style.display = 'none';
            input.focus();
            input.select();
            announce('Export-Optionen geoeffnet. Dateiname kann geaendert werden.');
        }
    }

    function closeExportPanel(silent) {
        const panel = document.getElementById('exportPanel');
        const btn = document.getElementById('exportOpenBtn');
        if (panel) panel.style.display = 'none';
        if (btn) { btn.style.display = ''; btn.focus(); }
        if (!silent) announce('Export abgebrochen.');
    }

    async function doExport(projectId, format) {
        const filenameInput = document.getElementById('exportFilename');
        const statusEl = document.getElementById('exportStatus');
        let baseName = filenameInput ? filenameInput.value.trim() : 'export';
        baseName = baseName.replace(/\.[^.]+$/, '');

        const ext = format === 'pdf' ? '.pdf' : format === 'xlsx' ? '.xlsx' : format === 'csv' ? '.csv' : '.json';
        const filename = baseName + ext;

        if (statusEl) statusEl.textContent = 'Wird exportiert...';
        announce(format.toUpperCase() + ' wird exportiert...');

        try {
            const url = format === 'pdf'
                ? '/api/projects/' + projectId + '/export'
                : '/api/projects/' + projectId + '/export/' + format;
            const res = await fetch(url, { method: 'POST' });
            if (res.ok) {
                const blob = await res.blob();
                downloadBlob(blob, filename);
                announce(filename + ' wurde heruntergeladen.');
                closeExportPanel(true);
            } else {
                if (statusEl) statusEl.textContent = 'Fehler beim Export.';
                announce('Fehler beim Export.');
            }
        } catch (err) {
            if (statusEl) statusEl.textContent = 'Verbindungsfehler.';
        }
    }

    function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    }

    // ─── Settings ────────────────────────────────────
    function showSettings() {
        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        highlightNav('settingsBtn');
        main.innerHTML = `
            <button class="back-btn" onclick="showDashboard()">Zurueck</button>
            <h2 class="section-title">Einstellungen</h2>
            <div class="card">
                <h3 style="margin-bottom:1rem;">Passwort aendern</h3>
                <form id="changePwForm" novalidate>
                    <div class="form-group">
                        <label for="old_password">Aktuelles Passwort</label>
                        <input type="password" id="old_password" required autocomplete="current-password">
                    </div>
                    <div class="form-group">
                        <label for="new_password">Neues Passwort (mind. 8 Zeichen)</label>
                        <input type="password" id="new_password" required minlength="8" autocomplete="new-password">
                    </div>
                    <div class="form-group">
                        <label for="new_password2">Neues Passwort wiederholen</label>
                        <input type="password" id="new_password2" required autocomplete="new-password">
                    </div>
                    <button type="submit" class="btn btn-primary">Passwort aendern</button>
                    <span id="pwMsg" role="status" aria-live="polite" style="margin-left:1rem;"></span>
                </form>
            </div>
            <div class="card" style="margin-top:1rem;">
                <h3>Kontoinformationen</h3>
                <p style="margin-top:0.5rem;color:var(--text-muted);">Angemeldet als: ${currentUser.display_name} (${currentUser.email})</p>
            </div>
            <div class="card" style="margin-top:1rem;">
                <h3 style="margin-bottom:1rem;">API-Schluessel</h3>
                <p style="margin-bottom:1rem;color:var(--text-muted);">Mit API-Schluesseln koennen externe Anwendungen Alt-Texte generieren.</p>
                <div id="apiKeyList" aria-live="polite"></div>
                <div style="margin-top:1rem;display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                    <label for="newKeyName" class="sr-only">Name fuer neuen API-Schluessel</label>
                    <input type="text" id="newKeyName" placeholder="Name (z.B. Meine App)" style="padding:0.5rem;border:1px solid var(--border);border-radius:4px;flex:1;min-width:150px;">
                    <button class="btn btn-primary" onclick="createApiKey()">Erstellen</button>
                </div>
                <div id="newKeyResult" role="status" aria-live="polite" style="margin-top:0.5rem;"></div>
            </div>
        `;

        document.getElementById('changePwForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const msg = document.getElementById('pwMsg');
            msg.textContent = '';
            msg.style.color = '';

            const old_password = document.getElementById('old_password').value;
            const new_password = document.getElementById('new_password').value;
            const new_password2 = document.getElementById('new_password2').value;

            if (new_password.length < 8) { msg.textContent = 'Mind. 8 Zeichen'; msg.style.color = 'var(--error)'; return; }
            if (new_password !== new_password2) { msg.textContent = 'Passwoerter stimmen nicht ueberein'; msg.style.color = 'var(--error)'; return; }

            const res = await fetch('/api/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ old_password, new_password }),
            });
            if (res.ok) {
                msg.textContent = 'Passwort geaendert!';
                msg.style.color = 'var(--success)';
                announce('Passwort wurde geaendert');
            } else {
                const d = await res.json();
                msg.textContent = d.detail || 'Fehler';
                msg.style.color = 'var(--error)';
            }
        });

        loadApiKeys();
    }

    async function loadApiKeys() {
        const list = document.getElementById('apiKeyList');
        if (!list) return;
        const res = await fetch('/api/api-keys');
        if (!res.ok) return;
        const data = await res.json();
        if (!data.keys || data.keys.length === 0) {
            list.innerHTML = '<p style="color:var(--text-muted);">Keine API-Schluessel vorhanden.</p>';
            return;
        }
        list.innerHTML = data.keys.map(k => `
            <div style="display:flex;justify-content:space-between;align-items:center;padding:0.5rem 0;border-bottom:1px solid var(--border,#eee);">
                <div>
                    <strong>${k.name}</strong>
                    <span style="color:var(--text-muted);font-size:0.85rem;margin-left:0.5rem;">Erstellt: ${new Date(k.created_at).toLocaleDateString('de-DE')}</span>
                    ${k.last_used ? '<span style="color:var(--text-muted);font-size:0.85rem;margin-left:0.5rem;">Zuletzt: ' + new Date(k.last_used).toLocaleDateString('de-DE') + '</span>' : ''}
                </div>
                <button class="btn btn-danger btn-small" onclick="deleteApiKey(${k.id})">Loeschen</button>
            </div>
        `).join('');
    }

    async function createApiKey() {
        const nameInput = document.getElementById('newKeyName');
        const result = document.getElementById('newKeyResult');
        const name = nameInput.value.trim();
        if (!name) { nameInput.focus(); return; }

        const res = await fetch('/api/api-keys', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
        });
        if (res.ok) {
            const data = await res.json();
            result.innerHTML = '<div style="padding:0.8rem;background:var(--bg-card,#f9f9f9);border:1px solid var(--border);border-radius:4px;"><strong>Neuer Schluessel (nur einmal sichtbar!):</strong><br><code style="word-break:break-all;font-size:0.9rem;">' + data.key + '</code></div>';
            nameInput.value = '';
            announce('API-Schluessel erstellt. Bitte jetzt kopieren.');
            loadApiKeys();
        } else {
            result.textContent = 'Fehler beim Erstellen.';
        }
    }

    async function deleteApiKey(id) {
        if (!confirm('API-Schluessel wirklich loeschen?')) return;
        await fetch('/api/api-keys/' + id, { method: 'DELETE' });
        announce('API-Schluessel geloescht');
        loadApiKeys();
    }

    // ─── Admin ───────────────────────────────────────
    async function showAdmin() {
        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        highlightNav('adminBtn');
        const res = await fetch('/api/admin/users');
        if (!res.ok) { announce('Kein Zugriff'); showDashboard(); return; }
        const data = await res.json();

        main.innerHTML = `
            <button class="back-btn" onclick="showDashboard()">Zurueck</button>
            <h2 class="section-title">Benutzerverwaltung (${data.users.length} Benutzer)</h2>
            <table class="admin-table" role="table" aria-label="Benutzerliste">
                <thead>
                    <tr><th>Name</th><th>E-Mail</th><th>Projekte</th><th>Status</th><th>Aktionen</th></tr>
                </thead>
                <tbody>
                    ${data.users.map(u => `
                    <tr>
                        <td>${u.display_name} ${u.is_admin ? '<span class="badge badge-admin">Admin</span>' : ''}</td>
                        <td>${u.email}</td>
                        <td>${u.project_count}</td>
                        <td><span class="badge ${u.is_active ? 'badge-done' : 'badge-inactive'}">${u.is_active ? 'Aktiv' : 'Gesperrt'}</span></td>
                        <td style="display:flex;gap:0.3rem;flex-wrap:wrap;">
                            ${u.id !== currentUser.id ? `
                                <button class="btn btn-secondary btn-small" onclick="toggleUser(${u.id})">${u.is_active ? 'Sperren' : 'Entsperren'}</button>
                                <button class="btn btn-secondary btn-small" onclick="resetUserPw(${u.id}, '${u.email}')">Passwort</button>
                                <button class="btn btn-danger btn-small" onclick="deleteUser(${u.id}, '${u.email}')">Loeschen</button>
                            ` : '<span style="color:var(--text-muted);font-size:0.85rem;">Sie selbst</span>'}
                        </td>
                    </tr>
                    `).join('')}
                </tbody>
            </table>
            <div class="card" style="margin-top:1.5rem;">
                <h3 style="margin-bottom:1rem;">Neuen Benutzer anlegen</h3>
                <form id="createUserForm" novalidate>
                    <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:flex-end;">
                        <div class="form-group" style="flex:1;min-width:150px;margin-bottom:0;">
                            <label for="newUserName">Name</label>
                            <input type="text" id="newUserName" required placeholder="Max Mustermann">
                        </div>
                        <div class="form-group" style="flex:1;min-width:200px;margin-bottom:0;">
                            <label for="newUserEmail">E-Mail</label>
                            <input type="email" id="newUserEmail" required placeholder="max@beispiel.de">
                        </div>
                        <div class="form-group" style="flex:1;min-width:150px;margin-bottom:0;">
                            <label for="newUserPw">Passwort (mind. 8)</label>
                            <input type="password" id="newUserPw" required minlength="8" placeholder="Passwort">
                        </div>
                        <div class="form-group" style="flex:1;min-width:150px;margin-bottom:0;">
                            <label for="newUserPw2">Passwort wiederholen</label>
                            <input type="password" id="newUserPw2" required minlength="8" placeholder="Wiederholen">
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin-bottom:0;">Anlegen</button>
                    </div>
                    <div id="createUserMsg" role="status" aria-live="polite" style="margin-top:0.75rem;"></div>
                </form>
            </div>
        `;

        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            var msg = document.getElementById('createUserMsg');
            msg.textContent = '';
            msg.style.color = '';
            var name = document.getElementById('newUserName').value.trim();
            var email = document.getElementById('newUserEmail').value.trim();
            var pw = document.getElementById('newUserPw').value;
            var pw2 = document.getElementById('newUserPw2').value;
            if (!name || !email || !pw) { msg.textContent = 'Bitte alle Felder ausfuellen.'; msg.style.color = 'var(--error)'; return; }
            if (pw.length < 8) { msg.textContent = 'Passwort muss mindestens 8 Zeichen haben.'; msg.style.color = 'var(--error)'; return; }
            if (pw !== pw2) { msg.textContent = 'Passwoerter stimmen nicht ueberein.'; msg.style.color = 'var(--error)'; return; }
            var res = await fetch('/api/admin/users/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ display_name: name, email: email, password: pw }),
            });
            var data = await res.json();
            if (res.ok) {
                msg.textContent = data.message;
                msg.style.color = 'var(--success)';
                announce('Benutzer erstellt: ' + name);
                document.getElementById('newUserName').value = '';
                document.getElementById('newUserEmail').value = '';
                document.getElementById('newUserPw').value = '';
                document.getElementById('newUserPw2').value = '';
                setTimeout(showAdmin, 1500);
            } else {
                msg.textContent = data.detail || 'Fehler beim Erstellen.';
                msg.style.color = 'var(--error)';
            }
        });
    }

    async function toggleUser(id) {
        await fetch('/api/admin/users/' + id + '/toggle-active', { method: 'POST' });
        showAdmin();
    }

    async function resetUserPw(id, email) {
        const pw = prompt('Neues Passwort fuer ' + email + ' (mind. 8 Zeichen):');
        if (!pw || pw.length < 8) { alert('Passwort muss mindestens 8 Zeichen haben.'); return; }
        const pw2 = prompt('Passwort wiederholen:');
        if (pw !== pw2) { alert('Passwoerter stimmen nicht ueberein.'); return; }
        const res = await fetch('/api/admin/users/' + id + '/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ new_password: pw }),
        });
        if (res.ok) { announce('Passwort zurueckgesetzt'); alert('Passwort wurde zurueckgesetzt.'); }
        else { alert('Fehler beim Zuruecksetzen.'); }
    }

    async function deleteUser(id, email) {
        if (!confirm('User "' + email + '" und ALLE Daten unwiderruflich loeschen? (DSGVO-Loeschung)')) return;
        const res = await fetch('/api/admin/users/' + id, { method: 'DELETE' });
        if (res.ok) { announce('User geloescht'); showAdmin(); }
        else { alert('Fehler beim Loeschen.'); }
    }

    // ─── Helpers ─────────────────────────────────────
    function highlightNav(id) {
        document.querySelectorAll('.header-btn').forEach(b => b.classList.remove('active'));
        if (id) document.getElementById(id)?.classList.add('active');
    }

    init();
    </script>
</body>
</html>
