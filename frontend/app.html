<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InkluDocs</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <a href="#mainContent" class="skip-link">Zum Hauptinhalt springen</a>
    <header>
        <div class="header-brand">
            <img src="/static/inklutec-logo.png" alt="INKLUTEC Logo" class="header-logo">
            <h1><span class="brand">Inklu</span>Docs</h1>
        </div>
        <div class="header-actions">
            <span id="userGreeting" style="color:rgba(255,255,255,0.85);font-size:0.95rem;margin-right:0.75rem;white-space:nowrap;" aria-label="Angemeldeter Benutzer"></span>
            <span id="dailyLimit" style="display:none;color:rgba(255,255,255,0.7);font-size:0.85rem;margin-right:0.75rem;white-space:nowrap;" aria-live="polite"></span>
            <button id="adminBtn" class="header-btn" style="display:none" aria-label="Benutzerverwaltung">Benutzer</button>
            <button id="settingsBtn" class="header-btn" aria-label="Einstellungen" style="display:none">Einstellungen</button>
            <button id="logoutBtn" class="header-btn" aria-label="Abmelden">Abmelden</button>
        </div>
    </header>

    <main id="mainContent" class="main-content" tabindex="-1"></main>

    <footer class="legal-footer" role="contentinfo" style="padding-bottom:2rem;">
        <div style="margin-bottom:0.5rem;">
            <button class="dsgvo-badge" type="button" aria-expanded="false" aria-controls="dsgvo-info" onclick="var d=document.getElementById('dsgvo-info');var open=d.classList.toggle('open');this.setAttribute('aria-expanded',open);"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v4.7c0 4.83-3.23 9.36-7 10.58-3.77-1.22-7-5.75-7-10.58V6.3l7-3.12zM11 7v2h2V7h-2zm0 4v6h2v-6h-2z"/></svg>DSGVO-konform – Verarbeitung in der EU</button>
            <div id="dsgvo-info" class="dsgvo-detail" role="region">Server in Deutschland (Hetzner, Falkenstein und centron, Bayern) und Frankreich (Mistral AI, Paris). Kein Datentransfer in die USA.</div>
        </div>
        <button id="newsBtn" class="news-btn" type="button">Ihr seid auf dem aktuellen Stand</button>
        <div style="margin-top:0.75rem;">
            <a href="/impressum">Impressum</a> |
            <a href="/datenschutz">Datenschutz</a> |
            <a href="/nutzungsbedingungen">Nutzungsbedingungen</a>
        </div>
    </footer>

    <div id="newsPanel" class="news-panel" role="dialog" aria-label="Neuigkeiten" aria-modal="true" hidden>
        <div class="news-panel-content">
            <div class="news-panel-header">
                <h2>Neuigkeiten</h2>
                <button id="newsClose" type="button">Neuigkeiten schliessen</button>
            </div>
            <div id="newsList" class="news-list"></div>
        </div>
    </div>

    <div id="liveRegion" class="sr-only" aria-live="polite" role="status"></div>

    <script>
    const main = document.getElementById('mainContent');
    const liveRegion = document.getElementById('liveRegion');
    let currentUser = null;
    let pollInterval = null;

    function announce(msg) {
        liveRegion.textContent = '';
        setTimeout(() => { liveRegion.textContent = msg; }, 100);
    }

    // ─── Init ────────────────────────────────────────
    async function init() {
        const res = await fetch('/api/me');
        if (res.status === 401) { window.location.href = '/'; return; }
        const meData = await res.json();
        currentUser = meData.user;
        if (meData.daily_limit) window._dailyLimit = meData.daily_limit;
        document.getElementById('userGreeting').textContent = 'Hallo, ' + currentUser.display_name;
        updateLimitDisplay();
        const _pid = new URLSearchParams(window.location.search).get('projekt');
        if (_pid) { showProject(_pid); } else { window.location.href = '/dashboard'; }
    }

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = '/';
    });
    document.getElementById('adminBtn').addEventListener('click', () => showAdmin());
    document.getElementById('settingsBtn').addEventListener('click', () => showSettings());

    // ─── Dashboard ───────────────────────────────────
    async function showDashboard() {
        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        highlightNav(null);
        const res = await fetch('/api/projects');
        if (res.status === 401) { window.location.href = '/'; return; }
        const data = await res.json();

        main.innerHTML = `
            <div class="upload-area" role="region" aria-label="Dateien hochladen oder Website scannen">
                <h2>Alt-Texte generieren</h2>
                <p>Laden Sie PDFs oder Bilder hoch, um Alt-Texte fuer alle enthaltenen Grafiken zu generieren.</p>
                <p style="font-size:0.9em;color:#555;margin-top:-0.5rem;">Hinweis: Damit die Grafiken in den PDF sauber erkannt werden koennen, sollte es sich um eine getaggte PDF handeln.</p>
                <label class="upload-btn" for="fileInput" role="button" tabindex="0">Dateien auswaehlen</label>
                <input type="file" id="fileInput" accept=".pdf,.jpg,.jpeg,.png,.gif,.svg,.webp,.heic,.heif,.bmp,.tiff,.tif" multiple aria-label="PDF oder Bilddateien auswaehlen">
                <div class="url-scan-area" style="margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--border,#ddd);">
                    <label for="urlInput" style="display:block;font-weight:600;margin-bottom:0.5rem;">Oder Website-URL eingeben</label>
                    <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
                        <input type="url" id="urlInput" placeholder="https://example.com" style="flex:1;min-width:200px;padding:0.6rem;border:1px solid var(--border,#ccc);border-radius:4px;font-size:1rem;" aria-describedby="urlHint">
                        <button class="btn btn-primary" id="scanBtn" onclick="scanUrl()" style="min-width:120px;">Website scannen</button>
                    </div>
                    <small id="urlHint" style="color:var(--text-muted,#666);display:block;margin-top:0.3rem;">Die Seite wird analysiert und alle Bilder ohne oder mit fehlenden Alt-Texten werden gefunden.</small>
                </div>
                <p id="uploadStatus" aria-live="polite" style="margin-top:1rem;padding:0.75rem;font-weight:600;text-align:center;"></p>
            </div>
            <h2 class="section-title">Meine Projekte</h2>
            <div id="projectList"></div>
        `;

        document.getElementById('fileInput').addEventListener('change', handleUpload);
        document.getElementById('urlInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); scanUrl(); }
        });
        renderProjectList(data.projects);
    }

    async function handleUpload(e) {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        const status = document.getElementById('uploadStatus');

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            status.textContent = files.length > 1
                ? 'Datei ' + (i + 1) + ' von ' + files.length + ' wird hochgeladen...'
                : 'Wird hochgeladen...';
            announce(file.name + ' wird hochgeladen');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/upload', { method: 'POST', body: formData });
                const data = await res.json();
                if (res.ok) {
                    if (i === files.length - 1) {
                        announce(data.total_images + ' Bilder gefunden.');
                        showProject(data.project_id);
                    }
                } else {
                    status.textContent = 'Fehler: ' + (data.detail || 'Upload fehlgeschlagen');
                    announce('Fehler beim Upload von ' + file.name);
                    return;
                }
            } catch (err) {
                status.textContent = 'Verbindungsfehler';
                return;
            }
        }
    }

    async function scanUrl() {
        const input = document.getElementById('urlInput');
        const btn = document.getElementById('scanBtn');
        const status = document.getElementById('uploadStatus');
        const url = input.value.trim();

        if (!url) { input.focus(); return; }
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            status.textContent = 'Bitte eine vollstaendige URL eingeben (mit https://)';
            announce('Bitte eine vollstaendige URL eingeben');
            input.focus();
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Wird gescannt...';
        status.textContent = 'Website wird analysiert...';
        announce('Website wird gescannt: ' + url);

        try {
            const res = await fetch('/api/scan-url', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url }),
            });
            const data = await res.json();
            if (res.ok) {
                announce(data.total_images + ' Bilder auf der Seite gefunden.');
                showProject(data.project_id);
            } else {
                status.textContent = 'Fehler: ' + (data.detail || 'Scan fehlgeschlagen');
                announce('Fehler beim Scannen der Website');
            }
        } catch (err) {
            status.textContent = 'Verbindungsfehler';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Website scannen';
        }
    }

    function renderProjectList(projects) {
        const list = document.getElementById('projectList');
        if (!projects.length) {
            list.innerHTML = '<div class="empty-state"><p>Noch keine Projekte. Laden Sie Dateien hoch oder scannen Sie eine Website.</p></div>';
            return;
        }
        const statusLabels = { uploaded:'Hochgeladen', extracting:'Extrahiere...', extracted:'Bereit', processing:'Verarbeite...', done:'Fertig', error:'Fehler' };
        const statusClass = s => s === 'done' ? 'badge-done' : s === 'processing' ? 'badge-processing' : s === 'extracted' ? 'badge-ready' : 'badge-error';
        const typeLabels = { pdf:'PDF', images:'Bilder', url:'Website' };

        const extractionLabel = p => (p.project_type === 'pdf')
            ? (p.extraction_method === 'pdfix' ? ' | Extraktion: Strukturell (PDFix)' : ' | Extraktion: Heuristisch (PyMuPDF)')
            : '';

        list.innerHTML = projects.map(p => {
            const progress = p.total_images > 0 ? Math.round((p.processed_images / p.total_images) * 100) : 0;
            const typeLabel = typeLabels[p.project_type] || 'PDF';
            return `
            <div class="card" role="article" aria-label="Projekt ${p.filename}">
                <div class="card-header">
                    <span class="card-name">${p.filename}</span>
                    <span class="badge" style="background:var(--text-muted,#888);color:#fff;padding:0.15rem 0.5rem;border-radius:4px;font-size:0.8rem;">${typeLabel}</span>
                    <span class="badge ${statusClass(p.status)}">${statusLabels[p.status] || p.status}</span>
                </div>
                <div class="card-info">${p.total_images} Bilder | ${p.processed_images} verarbeitet${extractionLabel(p)} | ${new Date(p.created_at).toLocaleDateString('de-DE')}</div>
                ${p.status === 'processing' ? `<div class="progress-bar" role="progressbar" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${progress}%"></div></div>` : ''}
                <div class="card-actions">
                    <button class="btn btn-primary" onclick="showProject(${p.id})">Oeffnen</button>
                    <button class="btn btn-danger btn-small" onclick="deleteProject(${p.id}, '${p.filename}')">Loeschen</button>
                </div>
            </div>`;
        }).join('');
    }

    async function deleteProject(id, name) {
        if (!confirm('Projekt "' + name + '" und alle Daten wirklich loeschen?')) return;
        await fetch('/api/projects/' + id, { method: 'DELETE' });
        announce('Projekt geloescht');
        showDashboard();
    }

    // ─── Project Detail ──────────────────────────────
    function uploadBlockHtml(project) {
        const tool = project.tool;
        if (tool === 'pdf') {
            if (project.total_images > 0) {
                return '<section class="card" aria-labelledby="addHeading"><h2 id="addHeading" class="section-title">Dokument</h2>'
                    + '<p style="color:var(--text-muted);margin:0;">Pro PDF-Projekt eine Datei. Fuer ein weiteres Dokument bitte ein neues Projekt anlegen.</p></section>';
            }
            return '<section class="card" aria-labelledby="addHeading"><h2 id="addHeading" class="section-title">PDF hinzufuegen</h2>'
                + '<label for="projUpload" class="sr-only">PDF-Datei auswaehlen</label>'
                + '<input type="file" id="projUpload" accept=".pdf" aria-describedby="projUploadHint" onchange="uploadInProject(event, ' + project.id + ')">'
                + '<p id="projUploadHint" style="color:var(--text-muted);margin-top:0.4rem;">Waehle ein PDF-Dokument. Daraus werden die Bilder extrahiert.</p>'
                + '<p id="projUploadStatus" role="status" aria-live="polite" style="margin-top:0.5rem;font-weight:600;"></p></section>';
        }
        if (tool === 'grafik') {
            return '<section class="card" aria-labelledby="addHeading"><h2 id="addHeading" class="section-title">Bilder hinzufuegen</h2>'
                + '<label for="projUpload" class="sr-only">Bilddateien auswaehlen</label>'
                + '<input type="file" id="projUpload" accept=".jpg,.jpeg,.png,.gif,.svg,.webp,.heic,.heif,.bmp,.tiff,.tif" multiple aria-describedby="projUploadHint" onchange="uploadInProject(event, ' + project.id + ')">'
                + '<p id="projUploadHint" style="color:var(--text-muted);margin-top:0.4rem;">Du kannst mehrere Bilder auswaehlen und jederzeit weitere hinzufuegen.</p>'
                + '<p id="projUploadStatus" role="status" aria-live="polite" style="margin-top:0.5rem;font-weight:600;"></p></section>';
        }
        return '';
    }

    async function uploadInProject(e, projectId) {
        const files = e.target.files;
        if (!files || files.length === 0) return;
        const status = document.getElementById('projUploadStatus');
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (status) status.textContent = files.length > 1 ? ('Datei ' + (i + 1) + ' von ' + files.length + ' wird hochgeladen...') : 'Wird hochgeladen...';
            announce(file.name + ' wird hochgeladen');
            const fd = new FormData();
            fd.append('file', file);
            fd.append('project_id', projectId);
            try {
                const res = await fetch('/api/upload', { method: 'POST', body: fd });
                const data = await res.json();
                if (!res.ok) {
                    if (status) status.textContent = 'Fehler: ' + (data.detail || 'Upload fehlgeschlagen');
                    announce('Fehler beim Upload: ' + (data.detail || ''));
                    return;
                }
                if (i === files.length - 1) {
                    announce(data.total_images + ' Bilder im Projekt.');
                    await showProject(projectId);
                    const h = document.getElementById('bilderHeading');
                    if (h) h.focus();
                }
            } catch (err) {
                if (status) status.textContent = 'Netzwerkfehler beim Upload.';
                announce('Netzwerkfehler beim Upload.');
                return;
            }
        }
    }

    async function showProject(projectId) {
        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        highlightNav(null);

        const res = await fetch('/api/projects/' + projectId);
        if (res.status === 401) { window.location.href = '/'; return; }
        const data = await res.json();
        const project = data.project;
        const images = data.images;

        const statusLabels = { neu:'Neu', extracted:'Bereit zur Verarbeitung', processing:'Alt-Texte werden generiert...', done:'Fertig', error:'Fehler' };
        const statusClass = project.status === 'done' ? 'badge-done' : project.status === 'processing' ? 'badge-processing' : 'badge-ready';
        const progress = project.total_images > 0 ? Math.round((project.processed_images / project.total_images) * 100) : 0;
        const extractionText = (project.project_type === 'pdf')
            ? (project.extraction_method === 'pdfix' ? 'Strukturell (PDFix)' : 'Heuristisch (PyMuPDF)')
            : null;

        main.innerHTML = `
            <button class="back-btn" onclick="window.location.href='/dashboard'">Zurück zum Dashboard</button>
            <div class="card">
                <div class="card-header">
                    <span class="card-name">${project.filename}</span>
                    <span class="badge ${statusClass}">${statusLabels[project.status] || project.status}</span>
                </div>
                <div class="card-info">${project.total_images} Bilder | ${project.processed_images} verarbeitet${extractionText ? ' | Extraktion: ' + extractionText : ''}</div>
                ${project.status === 'processing' ? `
                    <div class="progress-bar" role="progressbar" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100" aria-label="Fortschritt: ${progress} Prozent">
                        <div class="progress-fill" style="width:${progress}%"></div>
                    </div>
                    <p id="processingInfo" aria-live="polite">Bild ${project.processed_images} von ${project.total_images} wird verarbeitet.</p>
                ` : ''}
                <div class="card-actions">
                    ${project.status === 'extracted' ? '<button class="btn btn-primary" id="generateBtn" onclick="startGeneration(' + project.id + ')">Alt-Texte generieren</button>' : ''}
                    ${images.length > 0 ? `
                        <button class="btn btn-primary" id="exportOpenBtn" onclick="openExportPanel(${project.id}, '${project.filename}')">Exportieren</button>
                        <div id="exportPanel" style="display:none;margin-top:1rem;padding:1rem;border:1px solid var(--border);border-radius:8px;" role="region" aria-label="Export-Optionen">
                            <div class="form-group" style="margin-bottom:0.8rem;">
                                <label for="exportFilename" style="display:block;font-weight:600;margin-bottom:0.3rem;">Dateiname</label>
                                <input type="text" id="exportFilename" style="width:100%;padding:0.5rem;border:1px solid var(--border);border-radius:4px;font-size:0.95rem;">
                            </div>
                            <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                                <button class="btn btn-primary" onclick="doExport(${project.id}, 'xlsx')">Als Excel</button>
                                <button class="btn btn-primary" onclick="doExport(${project.id}, 'json')">Als JSON</button>
                                <button class="btn btn-secondary" onclick="doExport(${project.id}, 'csv')">Als CSV</button>
                                ${project.project_type === 'pdf' ? '<button class="btn btn-secondary" onclick="doExport(' + project.id + ', \'pdf\')">Als PDF (Beta)</button>' : ''}
                                <button class="btn btn-secondary" onclick="closeExportPanel()">Abbrechen</button>
                            </div>
                            <span id="exportStatus" role="status" aria-live="polite" style="display:block;margin-top:0.5rem;"></span>
                        </div>
                    ` : ''}
                </div>
            </div>
            ${uploadBlockHtml(project)}
            <h2 class="section-title" id="bilderHeading" tabindex="-1" style="margin-top:1.5rem">Bilder (${images.length})</h2>
            <div id="imageList"></div>
            ${inkluagentSectionHtml(projectId)}
        `;

        renderImages(images, projectId);
        inkluagentInit(projectId);

        if (project.status === 'processing') {
            pollInterval = setInterval(async () => {
                const sRes = await fetch('/api/projects/' + projectId + '/status');
                const sData = await sRes.json();
                if (sData.status === 'done' || sData.status === 'error') {
                    clearInterval(pollInterval); pollInterval = null;
                    announce(sData.status === 'done' ? 'Alle Alt-Texte wurden generiert.' : 'Fehler bei der Verarbeitung.');
                    showProject(projectId);
                } else if (sData.processed_images > project.processed_images) {
                    showProject(projectId);
                } else {
                    const bar = document.querySelector('.progress-fill');
                    const info = document.getElementById('processingInfo');
                    const newP = Math.round((sData.processed_images / sData.total_images) * 100);
                    if (bar) bar.style.width = newP + '%';
                    if (info) info.textContent = 'Bild ' + sData.processed_images + ' von ' + sData.total_images + ' wird verarbeitet.';
                }
            }, 10000);
        }
    }

    // Merkt sich pro Projekt, welche Seiten aufgeklappt sind, damit der Zustand
    // ueber das Neu-Rendern waehrend der Verarbeitung (Polling) hinweg erhalten bleibt.
    let openPages = new Set();
    let openPagesProjectId = null;

    function renderImages(images, projectId) {
        const list = document.getElementById('imageList');
        if (!images.length) {
            list.innerHTML = '<div class="empty-state"><p>Keine Bilder gefunden.</p></div>';
            return;
        }
        if (projectId !== openPagesProjectId) { openPages = new Set(); openPagesProjectId = projectId; }
        const imageTypes = ['foto','diagramm','karte','logo','tabelle','screenshot','infografik','strukturformel','dekorativ'];
        const complexTypes = ['diagramm','karte','tabelle','infografik','strukturformel'];

        // HTML-Escape fuer eingebetteten Seitentext (kann <, >, & enthalten)
        const esc = s => !s ? '' : String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

        // Gruppiere Bilder nach page_number (Web-Projekte: page_number 0/null -> Gruppe 0)
        const groups = new Map();
        for (const img of images) {
            const key = img.page_number > 0 ? img.page_number : 0;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(img);
        }

        // Eine Image-Card rendern
        const renderCard = img => {
            const hasLang = img.langbeschreibung && img.langbeschreibung.trim();
            const heading = img.page_number > 0
                ? `Bild ${img.image_index}, Seite ${img.page_number}`
                : `Bild ${img.image_index}`;
            return `
            <section class="image-review" aria-labelledby="img_heading_${img.id}">
                <h3 id="img_heading_${img.id}" class="image-heading">${heading}</h3>
                <div class="image-review-header">
                    <span class="image-meta">${img.width}x${img.height}px</span>
                    ${img.image_type && img.image_type !== 'unknown' ? '<span class="image-type-badge">' + img.image_type + '</span>' : ''}
                    ${img.konfidenz && img.status === 'done' ? '<span class="badge" style="background:' + (img.konfidenz === 'hoch' ? 'var(--success,#2a7)' : img.konfidenz === 'niedrig' ? 'var(--error,#c33)' : '#e90') + ';color:#fff;padding:0.15rem 0.5rem;border-radius:4px;font-size:0.8rem;">Konfidenz: ' + img.konfidenz + '</span>' : ''}
                    ${img.status === 'processing' ? '<span class="badge badge-processing">Wird analysiert...</span>' : ''}
                </div>
                <img src="/api/images/${img.id}/file" alt="Extrahiertes Bild${img.page_number > 0 ? ' von Seite ' + img.page_number : ''}" class="image-preview" loading="lazy">
                <label for="alttext_${img.id}" style="display:block;font-weight:600;margin-bottom:0.3rem;">
                    Alt-Text
                    <span class="save-indicator" id="saved_${img.id}">Gespeichert</span>
                </label>
                <textarea class="alt-text-field" id="alttext_${img.id}" data-image-id="${img.id}"
                    placeholder="${img.status === 'processing' ? 'Alt-Text wird generiert...' : (img.status === 'done' ? '' : 'Noch kein Alt-Text - hier eingeben oder generieren lassen')}"
                    ${img.status === 'processing' ? 'disabled' : ''}
                >${img.alt_text_edited || img.alt_text || img.original_alt || ''}</textarea>
                ${img.status === 'done' ? `
                    <div style="margin-top:0.5rem;display:flex;gap:0.5rem;align-items:center;">
                        <span style="font-size:0.85rem;color:var(--text-muted);">Alt-Text bewerten:</span>
                        <button class="btn btn-secondary btn-small feedback-btn" onclick="sendFeedback(${img.id}, 'good', this)" aria-label="Alt-Text gut" style="font-size:1.1rem;padding:0.3rem 0.6rem;${img.feedback === 'good' ? 'background:var(--success);color:white;border-color:var(--success);' : ''}">&#128077;</button>
                        <button class="btn btn-secondary btn-small feedback-btn" onclick="sendFeedback(${img.id}, 'bad', this)" aria-label="Alt-Text schlecht" style="font-size:1.1rem;padding:0.3rem 0.6rem;${img.feedback === 'bad' ? 'background:var(--error);color:white;border-color:var(--error);' : ''}">&#128078;</button>
                        <span id="feedback_status_${img.id}" role="status" aria-live="polite" style="font-size:0.85rem;"></span>
                    </div>
                ` : ''}
                <div id="langcontainer_${img.id}">
                ${hasLang ? `
                    <label for="langtext_${img.id}" style="display:block;font-weight:600;margin-top:0.8rem;margin-bottom:0.3rem;">Langbeschreibung</label>
                    <textarea class="alt-text-field langtext-field" id="langtext_${img.id}" style="min-height:80px;">${img.langbeschreibung}</textarea>
                    <div style="margin-top:0.5rem;display:flex;gap:0.5rem;align-items:center;">
                        <span style="font-size:0.85rem;color:var(--text-muted);">Langbeschreibung bewerten:</span>
                        <button class="btn btn-secondary btn-small" onclick="sendFeedback(${img.id}, 'good', this, 'lang')" aria-label="Langbeschreibung gut" style="font-size:1.1rem;padding:0.3rem 0.6rem;">&#128077;</button>
                        <button class="btn btn-secondary btn-small" onclick="sendFeedback(${img.id}, 'bad', this, 'lang')" aria-label="Langbeschreibung schlecht" style="font-size:1.1rem;padding:0.3rem 0.6rem;">&#128078;</button>
                        <span id="feedback_lang_status_${img.id}" role="status" aria-live="polite" style="font-size:0.85rem;"></span>
                    </div>
                ` : ''}
                </div>
                ${img.status === 'done' ? `
                    <div class="regen-area" style="margin-top:0.8rem;display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;">
                        <label for="regen_type_${img.id}" class="sr-only">Bildtyp fuer Neugenerierung</label>
                        <select id="regen_type_${img.id}" style="padding:0.4rem;border:1px solid var(--border,#ccc);border-radius:4px;font-size:0.9rem;">
                            <option value="">Automatisch</option>
                            ${imageTypes.map(t => '<option value="' + t + '"' + (img.image_type === t ? ' selected' : '') + '>' + t.charAt(0).toUpperCase() + t.slice(1) + '</option>').join('')}
                        </select>
                        <button class="btn btn-secondary btn-small" onclick="regenerateImage(${projectId}, ${img.id})" id="regen_btn_${img.id}">Neu generieren</button>
                        ${complexTypes.includes(img.image_type) && !hasLang ? '<button class="btn btn-secondary btn-small" onclick="generateLongDesc(' + projectId + ', ' + img.id + ')" id="longdesc_btn_' + img.id + '">Langbeschreibung (optional)</button>' : ''}
                        <span id="regen_status_${img.id}" role="status" aria-live="polite" style="font-size:0.85rem;"></span>
                    </div>
                ` : ''}
            </section>`;
        };

        // Eine Seitengruppe rendern.
        // Web-Projekte (pageNum 0): unveraendert, flache Cards ohne Klappbarkeit.
        // PDF-Seiten: ganze Seite als klappbares <details>, Ueberschrift ist der Schalter.
        const renderPageGroup = (pageNum, imgs) => {
            if (pageNum === 0) return imgs.map(renderCard).join('');
            const first = imgs[0];
            const isOpen = openPages.has(pageNum) ? ' open' : '';
            const count = imgs.length === 1 ? '1 Bild' : imgs.length + ' Bilder';
            const pageView = first.page_view_path
                ? `<img src="/api/images/${first.id}/page-view" alt="" class="page-view-image">` : '';
            const pageTextBlock = first.page_text ? `
                <details class="page-text-details">
                    <summary>Seitentext anzeigen</summary>
                    <div class="page-text-content">${esc(first.page_text)}</div>
                </details>` : '';
            return `
                <details class="page-section" data-page="${pageNum}"${isOpen}>
                    <summary class="page-summary">
                        <h2 class="page-heading" id="page_heading_${pageNum}">Seite ${pageNum} <span class="page-count">(${count})</span></h2>
                    </summary>
                    ${pageView}
                    ${pageTextBlock}
                    ${imgs.map(renderCard).join('')}
                </details>`;
        };

        // Render aller Gruppen in Reihenfolge der Seitennummer
        list.innerHTML = Array.from(groups.entries())
            .sort((a, b) => a[0] - b[0])
            .map(([pageNum, imgs]) => renderPageGroup(pageNum, imgs))
            .join('');

        // Auto-save alt-text on edit
        document.querySelectorAll('.alt-text-field:not(.langtext-field)').forEach(ta => {
            let timeout;
            ta.addEventListener('input', () => {
                clearTimeout(timeout);
                timeout = setTimeout(async () => {
                    const id = ta.dataset.imageId;
                    await fetch('/api/images/' + id + '/alt-text', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ alt_text: ta.value }),
                    });
                    const ind = document.getElementById('saved_' + id);
                    if (ind) { ind.classList.add('visible'); setTimeout(() => ind.classList.remove('visible'), 2000); }
                }, 800);
            });
        });

        // Offen/Zu-Zustand der Seiten merken (ueberlebt Neu-Rendern beim Polling)
        document.querySelectorAll('details.page-section').forEach(d => {
            d.addEventListener('toggle', () => {
                const p = Number(d.dataset.page);
                if (d.open) openPages.add(p); else openPages.delete(p);
            });
        });
    }

    async function sendFeedback(imageId, feedback, btn, type) {
        try {
            var res = await fetch('/api/images/' + imageId + '/feedback', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ feedback: feedback }),
            });
            if (res.ok) {
                var statusId = type === 'lang' ? 'feedback_lang_status_' + imageId : 'feedback_status_' + imageId;
                var statusEl = document.getElementById(statusId);
                var label = type === 'lang' ? 'Langbeschreibung' : 'Alt-Text';
                if (feedback === 'good') {
                    btn.style.background = 'var(--success)';
                    btn.style.color = 'white';
                    btn.style.borderColor = 'var(--success)';
                    if (statusEl) statusEl.textContent = 'Danke!';
                    announce('Feedback: ' + label + ' als gut bewertet');
                } else {
                    btn.style.background = 'var(--error)';
                    btn.style.color = 'white';
                    btn.style.borderColor = 'var(--error)';
                    if (statusEl) statusEl.textContent = 'Danke – wird geprueft';
                    announce('Feedback: ' + label + ' als verbesserungswuerdig bewertet');
                }
            }
        } catch (err) {}
    }

    async function regenerateImage(projectId, imageId) {
        const typeSelect = document.getElementById('regen_type_' + imageId);
        const btn = document.getElementById('regen_btn_' + imageId);
        const statusEl = document.getElementById('regen_status_' + imageId);
        const imageType = typeSelect ? typeSelect.value : '';

        btn.disabled = true;
        btn.textContent = 'Generiere...';
        if (statusEl) statusEl.textContent = '';
        announce('Alt-Text wird neu generiert');

        try {
            const body = {};
            if (imageType) body.image_type = imageType;

            const res = await fetch('/api/projects/' + projectId + '/regenerate/' + imageId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const data = await res.json();
            if (res.ok) {
                const ta = document.getElementById('alttext_' + imageId);
                if (ta) ta.value = data.alt_text || '';
                if (data.langbeschreibung) {
                    const lt = document.getElementById('langtext_' + imageId);
                    if (lt) lt.value = data.langbeschreibung;
                }
                if (statusEl) statusEl.textContent = 'Neu generiert (' + (data.konfidenz || 'mittel') + ')';
                announce('Alt-Text wurde neu generiert');
            } else {
                if (statusEl) statusEl.textContent = 'Fehler';
                announce('Fehler bei der Neugenerierung');
            }
        } catch (err) {
            if (statusEl) statusEl.textContent = 'Verbindungsfehler';
        } finally {
            btn.disabled = false;
            btn.textContent = 'Neu generieren';
        }
    }

    async function generateLongDesc(projectId, imageId) {
        const btn = document.getElementById('longdesc_btn_' + imageId);
        const statusEl = document.getElementById('regen_status_' + imageId);
        const typeSelect = document.getElementById('regen_type_' + imageId);
        const imageType = typeSelect ? typeSelect.value : '';

        if (btn) { btn.disabled = true; btn.textContent = 'Generiere...'; }
        if (statusEl) statusEl.textContent = '';
        announce('Langbeschreibung wird generiert');

        try {
            const body = { image_type: imageType || undefined, long_description: true };
            const res = await fetch('/api/projects/' + projectId + '/regenerate/' + imageId, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            const data = await res.json();
            if (res.ok && data.langbeschreibung) {
                const container = document.getElementById('langcontainer_' + imageId);
                if (container) {
                    container.innerHTML = '<label for="langtext_' + imageId + '" style="display:block;font-weight:600;margin-top:0.8rem;margin-bottom:0.3rem;">Langbeschreibung</label><textarea class="alt-text-field langtext-field" id="langtext_' + imageId + '" style="min-height:80px;">' + (data.langbeschreibung || '') + '</textarea>';
                }
                // Also update alt-text if improved
                if (data.alt_text) {
                    const ta = document.getElementById('alttext_' + imageId);
                    if (ta) ta.value = data.alt_text;
                }
                if (btn) btn.style.display = 'none';
                if (statusEl) statusEl.textContent = 'Langbeschreibung generiert';
                announce('Langbeschreibung wurde generiert');
            } else {
                if (statusEl) statusEl.textContent = 'Keine Langbeschreibung verfuegbar';
                announce('Keine Langbeschreibung verfuegbar');
            }
        } catch (err) {
            if (statusEl) statusEl.textContent = 'Verbindungsfehler';
        } finally {
            if (btn) { btn.disabled = false; btn.textContent = 'Langbeschreibung (optional)'; }
        }
    }

    async function startGeneration(projectId) {
        const btn = document.getElementById('generateBtn');
        // Pre-check daily limit
        if (window._dailyLimit && window._dailyLimit.remaining <= 0) {
            announce('Tageslimit erreicht. Das Limit wird um Mitternacht zurueckgesetzt.');
            alert('Tageslimit erreicht (' + window._dailyLimit.limit + ' Bilder pro Tag). Das Limit wird um Mitternacht (UTC) zurueckgesetzt.');
            return;
        }
        if (btn) { btn.disabled = true; btn.textContent = 'Wird gestartet...'; }
        announce('Alt-Text-Generierung wird gestartet.');
        const res = await fetch('/api/projects/' + projectId + '/generate', { method: 'POST' });
        if (res.ok) { showProject(projectId); }
        else { const d = await res.json(); announce('Fehler: ' + (d.detail || '')); }
    }

    // ─── Export ──────────────────────────────────────
    function openExportPanel(projectId, filename) {
        const panel = document.getElementById('exportPanel');
        const btn = document.getElementById('exportOpenBtn');
        const input = document.getElementById('exportFilename');
        if (panel && input) {
            input.value = filename.replace(/\.[^.]+$/, '');
            panel.style.display = 'block';
            if (btn) btn.style.display = 'none';
            input.focus();
            input.select();
            announce('Export-Optionen geoeffnet. Dateiname kann geaendert werden.');
        }
    }

    function closeExportPanel(silent) {
        const panel = document.getElementById('exportPanel');
        const btn = document.getElementById('exportOpenBtn');
        if (panel) panel.style.display = 'none';
        if (btn) { btn.style.display = ''; btn.focus(); }
        if (!silent) announce('Export abgebrochen.');
    }

    async function doExport(projectId, format) {
        const filenameInput = document.getElementById('exportFilename');
        const statusEl = document.getElementById('exportStatus');
        let baseName = filenameInput ? filenameInput.value.trim() : 'export';
        baseName = baseName.replace(/\.[^.]+$/, '');

        const ext = format === 'pdf' ? '.pdf' : format === 'xlsx' ? '.xlsx' : format === 'csv' ? '.csv' : '.json';
        const filename = baseName + ext;

        if (statusEl) statusEl.textContent = 'Wird exportiert...';
        announce(format.toUpperCase() + ' wird exportiert...');

        try {
            const url = format === 'pdf'
                ? '/api/projects/' + projectId + '/export'
                : '/api/projects/' + projectId + '/export/' + format;
            const res = await fetch(url, { method: 'POST' });
            if (res.ok) {
                const blob = await res.blob();
                downloadBlob(blob, filename);
                announce(filename + ' wurde heruntergeladen.');
                closeExportPanel(true);
            } else {
                if (statusEl) statusEl.textContent = 'Fehler beim Export.';
                announce('Fehler beim Export.');
            }
        } catch (err) {
            if (statusEl) statusEl.textContent = 'Verbindungsfehler.';
        }
    }

    function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1000);
    }

    async function loadApiKeys() {
        const list = document.getElementById('apiKeyList');
        const countEl = document.getElementById('apiKeyCount');
        if (!list) return;
        const res = await fetch('/api/api-keys');
        if (!res.ok) return;
        const data = await res.json();
        const keys = data.api_keys || [];

        if (countEl) countEl.textContent = '(' + keys.length + ')';

        if (keys.length === 0) {
            list.innerHTML = '<p style="color:var(--text-muted);">Noch keine API-Schluessel vorhanden.</p>';
            return;
        }
        list.innerHTML = '<ul role="list" style="list-style:none;padding:0;margin:0;">' + keys.map(k => `
            <li id="apikey-row-${k.id}" style="display:flex;justify-content:space-between;align-items:center;padding:0.6rem 0;border-bottom:1px solid var(--border,#eee);">
                <div>
                    <strong id="apikey-name-${k.id}">${k.name}</strong>
                    <span style="color:var(--text-muted);font-size:0.85rem;margin-left:0.5rem;">Erstellt: ${new Date(k.created_at).toLocaleDateString('de-DE')}</span>
                    ${k.last_used ? '<span style="color:var(--text-muted);font-size:0.85rem;margin-left:0.5rem;">Zuletzt verwendet: ' + new Date(k.last_used).toLocaleDateString('de-DE') + '</span>' : ''}
                </div>

    async function saveApiKeyName(id) {
        const nameInput = document.getElementById('editKeyName');
        const msg = document.getElementById('editKeyMsg');
        const newName = nameInput.value.trim();
        if (!newName) { nameInput.focus(); return; }

        const res = await fetch('/api/api-keys/' + id, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: newName }),
        });
        if (res.ok) {
            announce('Name geaendert zu: ' + newName);
            closeEditApiKey();
            loadApiKeys();
        } else {
            const d = await res.json();
            if (msg) { msg.textContent = d.detail || 'Fehler beim Speichern.'; msg.style.color = 'var(--error)'; }
        }
    }

    async function createApiKey() {
        const nameInput = document.getElementById('newKeyName');
        const result = document.getElementById('newKeyResult');
        const name = nameInput.value.trim();
        if (!name) { nameInput.focus(); return; }

        const res = await fetch('/api/api-keys', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name }),
        });
        if (res.ok) {
            const data = await res.json();
            result.innerHTML = '<div role="alert" style="padding:1rem;background:var(--bg-card,#f9f9f9);border:2px solid var(--primary);border-radius:4px;">' +
                '<h4>Neuer Schluessel erstellt</h4>' +
                '<p style="margin:0.5rem 0;color:var(--text-muted);">Dieser Schluessel wird nur einmal angezeigt. Bitte jetzt kopieren und sicher speichern.</p>' +
                '<code id="apiKeyValue" style="word-break:break-all;font-size:0.9rem;user-select:all;display:block;margin:0.5rem 0;padding:0.5rem;background:#fff;border:1px solid var(--border);border-radius:4px;" aria-label="API-Schluessel">' + data.api_key + '</code>' +
                '<div style="display:flex;gap:0.5rem;margin-top:0.8rem;">' +
                '<button class="btn btn-primary" onclick="copyApiKey()">Schluessel kopieren</button>' +
                '<button class="btn" onclick="closeNewKeyResult()">Zurueck zur Uebersicht</button>' +
                '</div></div>';
            nameInput.value = '';
            announce('Neuer API-Schluessel erstellt. Bitte jetzt kopieren.');
            loadApiKeys();
        } else {
            result.textContent = 'Fehler beim Erstellen.';

    function closeNewKeyResult() {
        document.getElementById('newKeyResult').innerHTML = '';
        announce('Schluessel-Anzeige geschlossen.');
        document.getElementById('newKeyName').focus();
    }

    function copyApiKey() {
        var key = document.getElementById('apiKeyValue');
        if (!key) return;
        navigator.clipboard.writeText(key.textContent).then(function() {
            announce('API-Schluessel wurde in die Zwischenablage kopiert.');
        }).catch(function() {
            var range = document.createRange();
            range.selectNodeContents(key);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);
            announce('Schluessel markiert. Bitte mit Befehl-C kopieren.');
        });
    }

    async function deleteApiKey(id, keyName) {
        var msg = 'API-Schluessel "' + (keyName || 'Unbenannt') + '" wirklich loeschen? Anwendungen die diesen Schluessel verwenden verlieren sofort den Zugriff.';
        if (!confirm(msg)) return;
        const res = await fetch('/api/api-keys/' + id, { method: 'DELETE' });
        if (res.ok) {
            announce('API-Schluessel geloescht.');
            closeEditApiKey();
            loadApiKeys();
        } else {
            announce('Fehler beim Loeschen.');
        }
    }

    // ─── Admin ───────────────────────────────────────
    async function showAdmin() {
        if (pollInterval) { clearInterval(pollInterval); pollInterval = null; }
        highlightNav('adminBtn');
        const res = await fetch('/api/admin/users');
        if (!res.ok) { announce('Kein Zugriff'); showDashboard(); return; }
        const data = await res.json();

        main.innerHTML = `
            <button class="back-btn" onclick="showDashboard()">Zurueck</button>
            <h2 class="section-title">Benutzerverwaltung (${data.users.length} Benutzer)</h2>
            <table class="admin-table" role="table" aria-label="Benutzerliste">
                <thead>
                    <tr><th>Name</th><th>E-Mail</th><th>Projekte</th><th>Status</th><th>Aktionen</th></tr>
                </thead>
                <tbody>
                    ${data.users.map(u => `
                    <tr>
                        <td>${u.display_name} ${u.is_admin ? '<span class="badge badge-admin">Admin</span>' : ''}</td>
                        <td>${u.email}</td>
                        <td>${u.project_count}</td>
                        <td><span class="badge ${u.is_active ? 'badge-done' : 'badge-inactive'}">${u.is_active ? 'Aktiv' : 'Gesperrt'}</span></td>
                        <td style="display:flex;gap:0.3rem;flex-wrap:wrap;">
                            ${u.id !== currentUser.id ? `
                                <button class="btn btn-secondary btn-small" onclick="toggleUser(${u.id})">${u.is_active ? 'Sperren' : 'Entsperren'}</button>
                                <button class="btn btn-secondary btn-small" onclick="resetUserPw(${u.id}, '${u.email}')">Passwort</button>
                                <button class="btn btn-danger btn-small" onclick="deleteUser(${u.id}, '${u.email}')">Loeschen</button>
                            ` : '<span style="color:var(--text-muted);font-size:0.85rem;">Sie selbst</span>'}
                        </td>
                    </tr>
                    `).join('')}
                </tbody>
            </table>
            <div class="card" style="margin-top:1.5rem;">
                <h3 style="margin-bottom:1rem;">Neuen Benutzer anlegen</h3>
                <form id="createUserForm" novalidate>
                    <div style="display:flex;gap:0.75rem;flex-wrap:wrap;align-items:flex-end;">
                        <div class="form-group" style="flex:1;min-width:150px;margin-bottom:0;">
                            <label for="newUserName">Name</label>
                            <input type="text" id="newUserName" required placeholder="Max Mustermann">
                        </div>
                        <div class="form-group" style="flex:1;min-width:200px;margin-bottom:0;">
                            <label for="newUserEmail">E-Mail</label>
                            <input type="email" id="newUserEmail" required placeholder="max@beispiel.de">
                        </div>
                        <div class="form-group" style="flex:1;min-width:150px;margin-bottom:0;">
                            <label for="newUserPw">Passwort (mind. 8)</label>
                            <input type="password" id="newUserPw" required minlength="8" placeholder="Passwort">
                        </div>
                        <div class="form-group" style="flex:1;min-width:150px;margin-bottom:0;">
                            <label for="newUserPw2">Passwort wiederholen</label>
                            <input type="password" id="newUserPw2" required minlength="8" placeholder="Wiederholen">
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin-bottom:0;">Anlegen</button>
                    </div>
                    <div id="createUserMsg" role="status" aria-live="polite" style="margin-top:0.75rem;"></div>
                </form>
            </div>
        `;

        document.getElementById('createUserForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            var msg = document.getElementById('createUserMsg');
            msg.textContent = '';
            msg.style.color = '';
            var name = document.getElementById('newUserName').value.trim();
            var email = document.getElementById('newUserEmail').value.trim();
            var pw = document.getElementById('newUserPw').value;
            var pw2 = document.getElementById('newUserPw2').value;
            if (!name || !email || !pw) { msg.textContent = 'Bitte alle Felder ausfuellen.'; msg.style.color = 'var(--error)'; return; }
            if (pw.length < 8) { msg.textContent = 'Passwort muss mindestens 8 Zeichen haben.'; msg.style.color = 'var(--error)'; return; }
            if (pw !== pw2) { msg.textContent = 'Passwoerter stimmen nicht ueberein.'; msg.style.color = 'var(--error)'; return; }
            var res = await fetch('/api/admin/users/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ display_name: name, email: email, password: pw }),
            });
            var data = await res.json();
            if (res.ok) {
                msg.textContent = data.message;
                msg.style.color = 'var(--success)';
                announce('Benutzer erstellt: ' + name);
                document.getElementById('newUserName').value = '';
                document.getElementById('newUserEmail').value = '';
                document.getElementById('newUserPw').value = '';
                document.getElementById('newUserPw2').value = '';
                setTimeout(showAdmin, 1500);
            } else {
                msg.textContent = data.detail || 'Fehler beim Erstellen.';
                msg.style.color = 'var(--error)';
            }
        });
    }

    async function toggleUser(id) {
        await fetch('/api/admin/users/' + id + '/toggle-active', { method: 'POST' });
        showAdmin();
    }

    async function resetUserPw(id, email) {
        const pw = prompt('Neues Passwort fuer ' + email + ' (mind. 8 Zeichen):');
        if (!pw || pw.length < 8) { alert('Passwort muss mindestens 8 Zeichen haben.'); return; }
        const pw2 = prompt('Passwort wiederholen:');
        if (pw !== pw2) { alert('Passwoerter stimmen nicht ueberein.'); return; }
        const res = await fetch('/api/admin/users/' + id + '/reset-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ new_password: pw }),
        });
        if (res.ok) { announce('Passwort zurueckgesetzt'); alert('Passwort wurde zurueckgesetzt.'); }
        else { alert('Fehler beim Zuruecksetzen.'); }
    }

    async function deleteUser(id, email) {
        if (!confirm('User "' + email + '" und ALLE Daten unwiderruflich loeschen? (DSGVO-Loeschung)')) return;
        const res = await fetch('/api/admin/users/' + id, { method: 'DELETE' });
        if (res.ok) { announce('User geloescht'); showAdmin(); }
        else { alert('Fehler beim Loeschen.'); }
    }

    // ─── Helpers ─────────────────────────────────────
    function highlightNav(id) {
        document.querySelectorAll('.header-btn').forEach(b => b.classList.remove('active'));
        if (id) document.getElementById(id)?.classList.add('active');
    }

    // ─── Drag & Drop ────────────────────────────────
    function setupDragDrop() {
        const uploadArea = document.querySelector('.upload-area');
        if (!uploadArea) return;

        ['dragenter', 'dragover'].forEach(evt => {
            uploadArea.addEventListener(evt, (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadArea.classList.add('drag-over');
            });
        });

        ['dragleave', 'drop'].forEach(evt => {
            uploadArea.addEventListener(evt, (e) => {
                e.preventDefault();
                e.stopPropagation();
                uploadArea.classList.remove('drag-over');
            });
        });

        uploadArea.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (!files || files.length === 0) return;
            const fileInput = document.getElementById('fileInput');
            fileInput.files = files;
            fileInput.dispatchEvent(new Event('change'));
        });
    }

    // ─── Neuigkeiten ────────────────────────────────
    let _allNews = [];

    async function loadNews() {
        const btn = document.getElementById('newsBtn');
        try {
            const res = await fetch('/api/news');
            if (!res.ok) return;
            const data = await res.json();
            _allNews = data.news || [];

            const lastRead = localStorage.getItem('inkludocs_news_read');
            const unread = lastRead
                ? _allNews.filter(n => n.datum > lastRead).length
                : _allNews.length;

            if (unread > 0) {
                btn.textContent = 'Neuigkeiten (' + unread + ')';
            } else {
                btn.textContent = 'Ihr seid auf dem aktuellen Stand';
            }

            const list = document.getElementById('newsList');
            list.innerHTML = _allNews.map(item =>
                '<div class="news-item"><span class="news-date">' + item.datum + '</span> ' + item.text + '</div>'
            ).join('');
        } catch (e) {
            // silently ignore
        }
    }

    function markNewsRead() {
        if (_allNews.length > 0) {
            localStorage.setItem('inkludocs_news_read', _allNews[0].datum);
        }
        document.getElementById('newsBtn').textContent = 'Ihr seid auf dem aktuellen Stand';
    }

    document.getElementById('newsBtn').addEventListener('click', () => {
        const panel = document.getElementById('newsPanel');
        const lastRead = localStorage.getItem('inkludocs_news_read');
        const visible = _allNews.slice(0, 10);
        const unread = lastRead ? visible.filter(n => n.datum > lastRead) : visible;
        const older = lastRead ? visible.filter(n => n.datum <= lastRead) : [];

        const list = document.getElementById('newsList');
        let html = '';

        if (unread.length > 0) {
            html += unread.map(item =>
                '<div class="news-item"><span class="news-date">' + item.datum + '</span> ' + item.text + '</div>'
            ).join('');
        } else {
            html += '<div class="news-item" style="text-align:center;color:var(--text-muted);">Keine neuen Updates</div>';
        }

        if (older.length > 0) {
            html += '<div class="news-divider">Fruehere Updates</div>';
            html += older.map(item =>
                '<div class="news-item news-item-read"><span class="news-date">' + item.datum + '</span> ' + item.text + '</div>'
            ).join('');
        }

        list.innerHTML = html;
        panel.hidden = false;
        document.getElementById('newsClose').focus();
    });

    document.getElementById('newsClose').addEventListener('click', () => {
        const panel = document.getElementById('newsPanel');
        panel.hidden = true;
        markNewsRead();
        document.getElementById('newsBtn').focus();
    });

    document.getElementById('newsPanel').addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            document.getElementById('newsPanel').hidden = true;
            markNewsRead();
            document.getElementById('newsBtn').focus();
        }
    });

    // ─── Daily limit display ─────────────────────────────
    function updateLimitDisplay() {
        const el = document.getElementById('dailyLimit');
        const dl = window._dailyLimit;
        if (!el || !dl) return;
        const pct = Math.round(dl.used / dl.limit * 100);
        if (pct >= 100) {
            el.textContent = 'Tageslimit erreicht';
            el.style.color = '#fca5a5';
        } else if (pct >= 80) {
            el.textContent = 'Noch ' + dl.remaining + ' Bilder heute';
            el.style.color = '#fde68a';
        } else {
            el.textContent = dl.used + '/' + dl.limit + ' Bilder heute';
        }
    }

    // Refresh limit after generation
    async function refreshDailyLimit() {
        try {
            const r = await fetch('/api/me');
            const d = await r.json();
            if (d.ok && d.daily_limit) {
                window._dailyLimit = d.daily_limit;
                updateLimitDisplay();
            }
        } catch(e) {}
    }

    // ─── Donate banner on dashboard ─────────────────────
    function addDonateBanner() {
        if (document.getElementById('donateBanner')) return;
        const projectList = document.getElementById('projectList');
        if (!projectList) return;
        const banner = document.createElement('div');
        banner.id = 'donateBanner';
        banner.setAttribute('role', 'complementary');
        banner.setAttribute('aria-label', 'Unterstuetzung');
        banner.style.cssText = 'margin-top:2rem;padding:1.25rem 1.5rem;background:linear-gradient(135deg,#fff7ed,#fef3c7);border:1px solid #fed7aa;border-radius:8px;text-align:center;';
        const dl = window._dailyLimit;
        const limitHint = (dl && dl.remaining <= 0)
            ? '<p style="color:#dc2626;font-weight:600;margin-bottom:0.5rem;">Tageslimit erreicht – morgen geht es weiter.</p>'
            : '';
        banner.innerHTML = limitHint +
            '<h2 style="font-size:1.15rem;color:#1b2a4a;margin:0 0 0.5rem 0;">InkluDocs unterstuetzen</h2>' +
            '<p style="margin:0 0 0.75rem 0;color:#1e293b;font-size:1rem;">InkluDocs ist kostenlos und wird laufend weiterentwickelt. Wenn Sie das Projekt unterstuetzen moechten, freuen wir uns ueber einen freiwilligen Beitrag.</p>' +
            '<a href="https://www.paypal.com/donate?business=steve.weidel%40gmail.com&item_name=InkluDocs+-+Freiwilliger+Beitrag&currency_code=EUR" target="_blank" rel="noopener" ' +
            'style="display:inline-block;background:#0070ba;color:white;padding:0.6rem 1.5rem;border-radius:6px;text-decoration:none;font-weight:600;font-size:1rem;" ' +
            'aria-label="InkluDocs per PayPal unterstuetzen">InkluDocs unterstuetzen</a>' +
            '<p style="margin:0.5rem 0 0 0;color:#64748b;font-size:0.85rem;">Ihr Beitrag hilft, Barrierefreiheit im Web voranzubringen.</p>';
        projectList.parentNode.insertBefore(banner, projectList.nextSibling);
    }

    // ─── Patch showDashboard to add drag & drop after render
    const _origShowDashboard = showDashboard;
    showDashboard = async function() {
        await _origShowDashboard();
        addDonateBanner();
        refreshDailyLimit();
        setupDragDrop();
    };

    // ─── InkluAgent (Chatbot pro Projekt) ────────────────────
    function inkluagentSectionHtml(projectId) {
        return ''
            + '<section class="inkluagent-section" aria-labelledby="inkluagentTitle" data-project-id="' + projectId + '">'
            +   '<h2 id="inkluagentTitle">Chatbot zur Alt-Text-Hilfe</h2>'
            +   '<p class="inkluagent-intro">Bitte den InkluAgent um Hilfe — z.B. einen Alt-Text fuer ein Bild generieren, '
            +   'einen vorhandenen Text in leichter Sprache umformulieren oder in eine andere Sprache uebersetzen. '
            +   'Bilder per Nummer benennen (z.B. <em>Bild 3</em>, <em>Bilder 1-5</em>). Maximal 10 Bilder pro Anfrage.</p>'
            +   '<button id="inkluagentToggle" type="button" aria-expanded="false" aria-controls="inkluagentPanel" class="inkluagent-toggle">'
            +     'Chatbot oeffnen'
            +   '</button>'
            +   '<div id="inkluagentPanel" class="inkluagent-panel" hidden>'
            +     '<div id="inkluagentLog" class="inkluagent-log" role="log" aria-live="polite" aria-label="Chat-Verlauf"></div>'
            +     '<form id="inkluagentForm" class="inkluagent-form">'
            +       '<label for="inkluagentInput" class="visually-hidden">Nachricht an den InkluAgent</label>'
            +       '<textarea id="inkluagentInput" rows="2" maxlength="5000" '
            +         'placeholder="z.B. \'Bild 3 in leichter Sprache\' oder \'Generiere Alt-Text fuer Bild 5\'" '
            +         'aria-describedby="inkluagentHint"></textarea>'
            +       '<div id="inkluagentHint" class="inkluagent-hint">Enter sendet, Shift+Enter macht einen Zeilenumbruch. Maximal 5000 Zeichen.</div>'
            +       '<div class="inkluagent-controls">'
            +         '<button type="submit" id="inkluagentSendBtn" class="btn btn-primary">Senden</button>'
            +         '<span id="inkluagentStatus" class="inkluagent-status" role="status" aria-live="polite"></span>'
            +       '</div>'
            +     '</form>'
            +   '</div>'
            + '</section>';
    }

    async function inkluagentInit(projectId) {
        window._inkluagentProjectId = projectId;
        const toggle = document.getElementById('inkluagentToggle');
        const input = document.getElementById('inkluagentInput');
        const form = document.getElementById('inkluagentForm');
        if (!toggle) return;
        toggle.addEventListener('click', () => {
            const isOpen = toggle.getAttribute('aria-expanded') === 'true';
            if (isOpen) inkluagentClose(); else inkluagentOpen(projectId, true);
        });
        if (form) {
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                inkluagentSend();
            });
        }
        if (input) {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    inkluagentSend();
                }
            });
        }
        const wasOpen = localStorage.getItem('inkluagent.panel.' + projectId) === 'open';
        if (wasOpen) await inkluagentOpen(projectId, false);
    }

    async function inkluagentOpen(projectId, focusInput) {
        const toggle = document.getElementById('inkluagentToggle');
        const panel = document.getElementById('inkluagentPanel');
        const input = document.getElementById('inkluagentInput');
        if (!toggle || !panel) return;
        toggle.setAttribute('aria-expanded', 'true');
        toggle.textContent = 'Chatbot schliessen';
        panel.hidden = false;
        try { localStorage.setItem('inkluagent.panel.' + projectId, 'open'); } catch (e) {}
        await inkluagentLoadHistory(projectId);
        if (focusInput && input) input.focus();
    }

    function inkluagentClose() {
        const toggle = document.getElementById('inkluagentToggle');
        const panel = document.getElementById('inkluagentPanel');
        if (!toggle || !panel) return;
        toggle.setAttribute('aria-expanded', 'false');
        toggle.textContent = 'Chatbot oeffnen';
        panel.hidden = true;
        const projectId = window._inkluagentProjectId;
        if (projectId) {
            try { localStorage.removeItem('inkluagent.panel.' + projectId); } catch (e) {}
        }
    }

    async function inkluagentLoadHistory(projectId) {
        const log = document.getElementById('inkluagentLog');
        if (!log) return;
        log.textContent = '';
        try {
            const res = await fetch('/api/projects/' + projectId + '/chat/history');
            if (res.status === 401) { window.location.href = '/'; return; }
            if (!res.ok) {
                inkluagentSetStatus('Verlauf konnte nicht geladen werden.', true);
                return;
            }
            const data = await res.json();
            for (const m of data.messages || []) {
                inkluagentAppendMessage(m.role, m.content);
            }
            log.scrollTop = log.scrollHeight;
        } catch (e) {
            inkluagentSetStatus('Fehler beim Laden des Verlaufs.', true);
        }
    }

    function inkluagentAppendMessage(role, content) {
        const log = document.getElementById('inkluagentLog');
        if (!log) return;
        const wrapper = document.createElement('div');
        wrapper.className = 'inkluagent-message ' + (role === 'user' ? 'user' : 'assistant');
        const roleEl = document.createElement('div');
        roleEl.className = 'inkluagent-message-role';
        roleEl.textContent = (role === 'user' ? 'Du' : 'InkluAgent');
        const contentEl = document.createElement('div');
        contentEl.className = 'inkluagent-message-content';
        contentEl.textContent = content || '';
        wrapper.appendChild(roleEl);
        wrapper.appendChild(contentEl);
        log.appendChild(wrapper);
    }

    function inkluagentSetStatus(text, isError) {
        const status = document.getElementById('inkluagentStatus');
        if (!status) return;
        status.textContent = text || '';
        if (isError) status.setAttribute('data-state', 'error');
        else status.removeAttribute('data-state');
    }

    async function inkluagentSend() {
        const projectId = window._inkluagentProjectId;
        const input = document.getElementById('inkluagentInput');
        const sendBtn = document.getElementById('inkluagentSendBtn');
        const log = document.getElementById('inkluagentLog');
        if (!projectId || !input || !sendBtn || !log) return;
        const message = input.value.trim();
        if (!message) {
            inkluagentSetStatus('Bitte eine Nachricht eingeben.', true);
            input.focus();
            return;
        }
        if (message.length > 5000) {
            inkluagentSetStatus('Nachricht ist zu lang (max. 5000 Zeichen).', true);
            return;
        }
        inkluagentAppendMessage('user', message);
        log.scrollTop = log.scrollHeight;
        input.value = '';
        sendBtn.disabled = true;
        inkluagentSetStatus('InkluAgent denkt nach...', false);
        try {
            const res = await fetch('/api/projects/' + projectId + '/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });
            if (res.status === 401) { window.location.href = '/'; return; }
            if (!res.ok) {
                let detail = 'HTTP ' + res.status;
                try { const e = await res.json(); detail = e.detail || detail; } catch (_) {}
                inkluagentSetStatus(detail, true);
                return;
            }
            const data = await res.json();
            inkluagentAppendMessage('assistant', data.reply || '(leere Antwort)');
            log.scrollTop = log.scrollHeight;
            inkluagentSetStatus('', false);
            // Refresh-Actions vom Chatbot: pro Bild Textarea-Wert live setzen.
            // Wenn Bild nicht im DOM (z.B. noch nicht gerendert), Fallback auf Full-Reload.
            const refreshActions = (data.actions || []).filter(a => a && a.type === 'refresh_image');
            let needsFullReload = false;
            let updatedCount = 0;
            for (const ra of refreshActions) {
                const ta = document.getElementById('alttext_' + ra.image_id);
                if (ta && ra.alt_text != null) {
                    ta.value = ra.alt_text;
                    updatedCount++;
                    const ind = document.getElementById('saved_' + ra.image_id);
                    if (ind) { ind.classList.add('visible'); setTimeout(() => ind.classList.remove('visible'), 2000); }
                } else if (!ta) {
                    needsFullReload = true;
                }
                const lta = document.getElementById('langtext_' + ra.image_id);
                if (lta && ra.langbeschreibung != null) {
                    lta.value = ra.langbeschreibung;
                } else if (ra.langbeschreibung) {
                    // Neue Langbeschreibung gesetzt, aber Feld noch nicht im DOM -> Full-Reload
                    needsFullReload = true;
                }
            }
            if (updatedCount > 0) {
                announce('InkluAgent hat ' + updatedCount + ' Alt-Text' + (updatedCount === 1 ? '' : 'e') + ' aktualisiert.');
            }
            if (needsFullReload && typeof showProject === 'function') {
                setTimeout(() => showProject(projectId), 800);
            }
        } catch (e) {
            inkluagentSetStatus('Verbindungsfehler. Bitte erneut versuchen.', true);
        } finally {
            sendBtn.disabled = false;
            input.focus();
        }
    }

    loadNews();
    init();
    </script>
