<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InkluDocs - Nutzungsbedingungen</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
<a href="#main" class="dash-skip">Zum Hauptinhalt springen</a>
<div class="app-shell">
  <div class="app-sidebar" id="appSidebar"></div>
  <div class="app-content">
    <main id="main" class="dash-main" tabindex="-1">
      <h1>Nutzungsbedingungen</h1>
      <p class="dash-sub">Inhalt aus
        <a href="/nutzungsbedingungen">den öffentlichen Nutzungsbedingungen</a> — eine Quelle, kein Doppeltext.</p>
      <div id="legalContent" aria-busy="true" role="region" aria-label="Nutzungsbedingungen">
        <p class="dash-sub">Inhalt wird geladen …</p>
      </div>
    </main>
    <footer class="dash-footer">
      <a href="/impressum-app">Impressum</a> &nbsp;·&nbsp; <a href="/datensicherheit">Datenschutz</a> &nbsp;·&nbsp; <a href="/nutzungsbedingungen-app">Nutzungsbedingungen</a>
    </footer>
  </div>
</div>

<div class="sr-only" role="status" aria-live="polite" id="liveRegion"></div>

<script src="/static/dashboard.js"></script>
<script>
  // Steve 08.06.2026: Single Source of Truth — lade die öffentlichen
  // /nutzungsbedingungen, extrahiere den .legal-container und embedde ihn in
  // den Dashboard-Rahmen. Verhält sich exakt wie /datensicherheit (Vorbild).
  (async function loadNutzungsbedingungenInline() {
    const target = document.getElementById('legalContent');
    try {
      const res = await fetch('/nutzungsbedingungen', { credentials: 'same-origin' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const container = doc.querySelector('.legal-container');
      if (!container) throw new Error('Nutzungsbedingungen-Inhalt nicht gefunden (.legal-container fehlt)');
      container.querySelectorAll('h1').forEach((h) => h.remove());
      container.querySelectorAll('nav.auth-links').forEach((n) => n.remove());
      target.innerHTML = '';
      target.appendChild(container);
      target.setAttribute('aria-busy', 'false');
    } catch (err) {
      target.innerHTML = '<p style="color:var(--error,#c33);">Nutzungsbedingungen konnten nicht geladen werden: '
        + (err && err.message ? err.message : 'Unbekannter Fehler')
        + '. Bitte stattdessen die <a href="/nutzungsbedingungen">öffentlichen Nutzungsbedingungen</a> aufrufen.</p>';
      target.setAttribute('aria-busy', 'false');
    }
  })();
</script>
</body>
</html>
