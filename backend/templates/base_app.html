<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}InkluDocs{% endblock %}{% if is_staging %} (Testumgebung){% endif %}</title>
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/dashboard.css">
{% block head_extra %}{% endblock %}
</head>
<body>
<a href="#main" class="dash-skip">{{ _('Zum Hauptinhalt springen') }}</a>
<div class="app-shell">
  <div class="app-sidebar" id="appSidebar"></div>
  <div class="app-content">
    <main id="main" class="dash-main" tabindex="-1">
{% block main %}{% endblock %}
    </main>
    <footer class="dash-footer"></footer>
  </div>
</div>

<div class="sr-only" role="status" aria-live="polite" id="liveRegion"></div>

<script>
window.LANG = "{{ current_lang }}";
window.I18N = {{ i18n_json|safe }};
</script>
<script src="/static/dashboard.js"></script>
{% block page_script %}{% endblock %}
</body>
</html>
