{% extends "base_start.html" %}

{% block title %}InkluDocs - {{ _('Passwort vergessen') }}{% endblock %}

{% block main_class %}start-main-auth{% endblock %}

{% block main %}
        <div class="auth-container" role="region" aria-label="{{ _('Passwort zurücksetzen') }}">
            <h1>{{ _('Passwort zurücksetzen') }}</h1>
            <form id="forgotForm" novalidate>
                <div class="form-group">
                    <label for="email">{{ _('E-Mail-Adresse') }}</label>
                    <input type="email" id="email" name="email" required autocomplete="email" autofocus>
                </div>
                <button type="submit" class="btn-full">{{ _('Reset-Link anfordern') }}</button>
                <div id="errorMsg" class="error-message" role="alert" aria-live="polite"></div>
                <div id="successMsg" class="success-message" role="status" aria-live="polite"></div>
                <div id="resetLink" style="margin-top:1rem;display:none;">
                    <label for="resetUrl">{{ _('Reset-Link (bitte kopieren und im Browser öffnen):') }}</label>
                    <input type="text" id="resetUrl" readonly style="margin-top:0.5rem;background:#f1f5f9;">
                </div>
            </form>
            <div class="auth-links center">
                <a href="/login">{{ _('Zurück zur Anmeldung') }}</a>
            </div>
        </div>
    <script>
        // Übersetzbare UI-Strings für JavaScript (von Jinja2 per Request injiziert)
        const T = {
            enterEmail: {{ _('Bitte E-Mail-Adresse eingeben.')|tojson }},
            linkCreated: {{ _('Reset-Link wurde erstellt.')|tojson }},
            maybeSent: {{ _('Falls ein Konto existiert, wurde ein Reset-Link erstellt.')|tojson }},
            genericError: {{ _('Fehler aufgetreten.')|tojson }},
            connError: {{ _('Verbindungsfehler.')|tojson }},
        };

        const form = document.getElementById('forgotForm');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = '';
            successMsg.textContent = '';
            document.getElementById('resetLink').style.display = 'none';

            const email = document.getElementById('email').value.trim();
            if (!email) {
                errorMsg.textContent = T.enterEmail;
                return;
            }
            try {
                const res = await fetch('/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email }),
                });
                const data = await res.json();
                if (res.ok) {
                    if (data.reset_url) {
                        successMsg.textContent = T.linkCreated;
                        document.getElementById('resetLink').style.display = 'block';
                        document.getElementById('resetUrl').value = data.reset_url;
                    } else {
                        successMsg.textContent = data.message || T.maybeSent;
                    }
                } else {
                    errorMsg.textContent = data.detail || T.genericError;
                }
            } catch (err) {
                errorMsg.textContent = T.connError;
            }
        });
    </script>
{% endblock %}
