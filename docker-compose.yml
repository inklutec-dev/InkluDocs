services:
  inkludocs:
    build: .
    container_name: inkludocs
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - inkludocs_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-inkludocs-production-key-2025}
      - OLLAMA_URL=http://10.100.0.1:11434
      - OLLAMA_MODEL=qwen3-vl:8b-instruct-q8_0
      - REGISTRATION_ENABLED=true
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - NOTIFICATION_EMAIL=support@inklutec.de
      - MISTRAL_ENABLED=${MISTRAL_ENABLED:-true}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - PIPELINE_MODE=${PIPELINE_MODE:-mistral_primary}
      # v3.6 (14.04.2026): Dreistufige Mistral-Pipeline
      - MISTRAL_MODEL_CLASSIFY=${MISTRAL_MODEL_CLASSIFY:-mistral-medium-latest}
      - MISTRAL_MODEL_GENERATE=${MISTRAL_MODEL_GENERATE:-pixtral-large-latest}
      - MISTRAL_MODEL_VALIDATE=${MISTRAL_MODEL_VALIDATE:-mistral-large-latest}
      - VALIDATOR_ENABLED=${VALIDATOR_ENABLED:-true}
      - VALIDATOR_MODE=${VALIDATOR_MODE:-flag}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - inklucut_default

volumes:
  inkludocs_data:

networks:
  inklucut_default:
    external: true
