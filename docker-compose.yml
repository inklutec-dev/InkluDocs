services:
  inkludocs:
    image: inkludocs:v4-20260904
    container_name: inkludocs
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - inkludocs_data:/app/data
    environment:
      # Log-Zeilen sofort ausgeben (01.09.2026): print ist im Container sonst gepuffert, Zeitstempel im Log stimmen nicht.
      - PYTHONUNBUFFERED=1
      # PDF_LANGBESCHREIBUNG (03.06.2026): Langbeschreibung bei PDF an/aus, Standard off. Siehe .env / backend main.py.
      - PDF_LANGBESCHREIBUNG=${PDF_LANGBESCHREIBUNG:-off}
      # Production-spezifisch
      - SECRET_KEY=${SECRET_KEY:-inkludocs-production-key-2025}
      - BASE_URL=https://inkludocs.inklutec.de
      - REGISTRATION_ENABLED=true
      - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-support@inklutec.de}
      # SMTP
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      # Altlast Ollama (Pfad seit 29.04.2026 nicht mehr aktiv)
      - OLLAMA_URL=http://10.100.0.1:11434
      - OLLAMA_MODEL=qwen3-vl:8b-instruct-q8_0
      # Mistral - Fallback-Provider + InkluAgent
      - MISTRAL_ENABLED=${MISTRAL_ENABLED:-true}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - PIPELINE_MODE=${PIPELINE_MODE:-mistral_primary}
      - MISTRAL_MODEL_CLASSIFY=${MISTRAL_MODEL_CLASSIFY:-mistral-medium-latest}
      - MISTRAL_MODEL_GENERATE=${MISTRAL_MODEL_GENERATE:-pixtral-large-latest}
      - MISTRAL_MODEL_VALIDATE=${MISTRAL_MODEL_VALIDATE:-mistral-large-latest}
      # v4 + Bedrock - Defaults sind Production-Werte (Fail-Safe wenn --env-file vergessen)
      - PIPELINE_VERSION=${PIPELINE_VERSION:-v4}
      - V4_PASS_MODE=${V4_PASS_MODE:-lean}
      - V4_VERIFY_MODE=kritisch
      - V4_VERIFY_KORREKTUR=on
      - V4_PROMPT_CACHE=${V4_PROMPT_CACHE:-off}  # Prompt-Caching 03.09.2026: Bilddaten ans Ende, fester Anfang mit cache_control (off = Prompts wie vorher)
      # Abo-/Credit-System (31.07.2026): off = nur zaehlen, on = Kontingente durchsetzen (Review-Befund 3)
      - ABO_ENFORCEMENT=${ABO_ENFORCEMENT:-off}
      # Rollout 31.08.2026: Tageslimit ausdruecklich (wie Staging), Umwandler-Dienst, Tageslauf, Stripe
      - DAILY_IMAGE_LIMIT=${DAILY_IMAGE_LIMIT:-500}
      - KONVERTER_URL=http://inkludocs-konverter:8090
      - TAGESLAUF_TOKEN=${TAGESLAUF_TOKEN:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - V4_PROMPT_MODE=${V4_PROMPT_MODE:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-bedrock}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - BEDROCK_MODEL_CLASSIFY=${BEDROCK_MODEL_CLASSIFY:-eu.anthropic.claude-sonnet-4-6}
      - BEDROCK_MODEL_INVENTAR=${BEDROCK_MODEL_INVENTAR:-eu.anthropic.claude-sonnet-4-6}
      - BEDROCK_MODEL_GENERATE=${BEDROCK_MODEL_GENERATE:-eu.anthropic.claude-sonnet-4-6}
      - BEDROCK_MODEL_VALIDATE=${BEDROCK_MODEL_VALIDATE:-eu.anthropic.claude-sonnet-4-6}
      # Validator
      - VALIDATOR_ENABLED=${VALIDATOR_ENABLED:-false}
      - VALIDATOR_MODE=${VALIDATOR_MODE:-off}
      # Features
      - PDFIX_ENABLED=${PDFIX_ENABLED:-true}
      # PDFix-Lizenz (27.08.2026): aus der Env-Datei; leer = Testversion
      - PDFIX_LICENSE_USER=${PDFIX_LICENSE_USER:-}
      - DAILY_CHAT_LIMIT=${DAILY_CHAT_LIMIT:-100}   # Chat-Bremse je Konto/Tag (28.08.2026)
      - PDFIX_LICENSE_KEY=${PDFIX_LICENSE_KEY:-}
      - DEBUG_GEN_RAW=${DEBUG_GEN_RAW:-false}
      - INKLUAGENT_ENABLED=${INKLUAGENT_ENABLED:-true}
      - INKLUAGENT_PROVIDER=${INKLUAGENT_PROVIDER:-bedrock}
      - INKLUAGENT_BEDROCK_MODEL_TEXT=${INKLUAGENT_BEDROCK_MODEL_TEXT:-eu.anthropic.claude-sonnet-4-6}
      - INKLUAGENT_BEDROCK_MODEL_VISION=${INKLUAGENT_BEDROCK_MODEL_VISION:-eu.anthropic.claude-sonnet-4-6}
      - INKLUAGENT_INTENT_MODEL=${INKLUAGENT_INTENT_MODEL:-eu.anthropic.claude-haiku-4-5-20251001-v1:0}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - INKLUAGENT_AGENTIC=${INKLUAGENT_AGENTIC:-true}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - inklucut_default

  # Umwandler (Rollout 31.08.2026): LibreOffice + veraPDF 1.31.163 (festgenagelt), nur im
  # Compose-Netz erreichbar, kein Port nach aussen, keine Volumes. Getestetes Staging-Image.
  inkludocs-konverter:
    image: inkludocs-konverter:v4-20260901-lo262
    container_name: inkludocs-konverter
    restart: unless-stopped
    networks:
      - default

volumes:
  inkludocs_data:

networks:
  inklucut_default:
    external: true
