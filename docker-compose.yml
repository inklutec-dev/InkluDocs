services:
  inkludocs:
    build: .
    container_name: inkludocs
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - inkludocs_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-inkludocs-production-key-2025}
      - OLLAMA_URL=http://10.100.0.1:11434
      - OLLAMA_MODEL=qwen3-vl:8b-instruct-q8_0
      - REGISTRATION_ENABLED=false
      - SMTP_SERVER=w01ccfc3.kasserver.com
      - SMTP_PORT=587
      - SMTP_USER=kontakt@inklutec.de
      - SMTP_PASS=Ewigkeit-2023
      - SMTP_FROM=kontakt@inklutec.de
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - inklucut_default

volumes:
  inkludocs_data:

networks:
  inklucut_default:
    external: true
