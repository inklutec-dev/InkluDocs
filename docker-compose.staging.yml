services:
  inkludocs-staging:
    build: .
    container_name: inkludocs-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8001"
    volumes:
      - inkludocs_staging_data:/app/data
    environment:
      - SECRET_KEY=${SECRET_KEY:-inkludocs-staging-key-2026}
      - OLLAMA_URL=http://10.100.0.1:11434
      - OLLAMA_MODEL=qwen3-vl:8b-instruct-q8_0
      - REGISTRATION_ENABLED=true
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - NOTIFICATION_EMAIL=support@inklutec.de
      - MISTRAL_ENABLED=${MISTRAL_ENABLED:-true}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - PIPELINE_MODE=${PIPELINE_MODE:-mistral_primary}
      # v3.3 (14.04.2026): Dreistufige Mistral-Pipeline, Modelle austauschbar
      - MISTRAL_MODEL_CLASSIFY=${MISTRAL_MODEL_CLASSIFY:-mistral-medium-latest}
      - MISTRAL_MODEL_GENERATE=${MISTRAL_MODEL_GENERATE:-pixtral-large-latest}
      - MISTRAL_MODEL_VALIDATE=${MISTRAL_MODEL_VALIDATE:-mistral-large-latest}
      - VALIDATOR_ENABLED=${VALIDATOR_ENABLED:-true}
      - VALIDATOR_MODE=${VALIDATOR_MODE:-correct}
      - BASE_URL=https://staging.inkludocs.inklutec.de
      # PDFIX-INTEGRATION (24.04.2026): Kill-Switch, default OFF. Fuer Staging auf true.
      - PDFIX_ENABLED=${PDFIX_ENABLED:-true}
      # v3.7 (28.04.2026): Debug-Logging fuer Generator-Rohausgabe (Truncation-Audit)
      - DEBUG_GEN_RAW=${DEBUG_GEN_RAW:-true}
      # InkluAgent (Chatbot) — auf Staging default ON
      - INKLUAGENT_ENABLED=${INKLUAGENT_ENABLED:-true}
      # AWS Bedrock (08.05.2026): Anthropic Claude über Frankfurt fuer v4
      - LLM_PROVIDER=${LLM_PROVIDER:-mistral}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - BEDROCK_MODEL_CLASSIFY=${BEDROCK_MODEL_CLASSIFY:-eu.anthropic.claude-haiku-4-5}
      - BEDROCK_MODEL_INVENTAR=${BEDROCK_MODEL_INVENTAR:-eu.anthropic.claude-sonnet-4-6}
      - BEDROCK_MODEL_GENERATE=${BEDROCK_MODEL_GENERATE:-eu.anthropic.claude-sonnet-4-6}
      - BEDROCK_MODEL_VALIDATE=${BEDROCK_MODEL_VALIDATE:-eu.anthropic.claude-sonnet-4-6}
      - PIPELINE_VERSION=${PIPELINE_VERSION:-v3_7}
      - V4_PASS_MODE=${V4_PASS_MODE:-full}
      - V4_PROMPT_MODE=${V4_PROMPT_MODE:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - inklucut_default

volumes:
  inkludocs_staging_data:

networks:
  inklucut_default:
    external: true
