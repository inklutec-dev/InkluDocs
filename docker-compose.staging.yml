# Eigener Compose-Projektname, damit Staging NICHT mit Production kollidiert.
# Vorher leiteten beide Compose-Dateien (gleiches Verzeichnis, kein name:) den
# Default "inkludocs" ab -> Prod-Container erschien als "orphan" bei Staging-
# Befehlen; ein versehentliches --remove-orphans haette Production geloescht.
# Production bleibt unveraendert beim Default "inkludocs".
name: inkludocs-staging

services:
  inkludocs-staging:
    build: .
    container_name: inkludocs-staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8001"
    volumes:
      - inkludocs_staging_data:/app/data
    environment:
      # Nur STAGING: Testlaeufe des InkluEdit-Website-Einzugs brauchen mehr
      # als 100 Bilder/Tag. Auf PROD bleibt die Vorgabe 100 unangetastet.
      - DAILY_IMAGE_LIMIT=500
      - DAILY_CHAT_LIMIT=${DAILY_CHAT_LIMIT:-100}   # Chat-Bremse je Konto/Tag (28.08.2026)
      # NUR Staging (19.08.2026): erlaubt verify_multidatei2 den Scan des
      # eigenen Test-HTTP-Servers auf 127.0.0.1. Auf Prod/Demo NIE setzen.
      - SCAN_ERLAUBE_LOOPBACK=1
      # PDF_LANGBESCHREIBUNG (03.06.2026): Langbeschreibung bei PDF an/aus, Standard off. Siehe .env / backend main.py.
      - PDF_LANGBESCHREIBUNG=${PDF_LANGBESCHREIBUNG:-off}
      - SECRET_KEY=${SECRET_KEY:-inkludocs-staging-key-2026}
      - REGISTRATION_ENABLED=true
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - NOTIFICATION_EMAIL=support@inklutec.de
      - BASE_URL=https://staging.inkludocs.inklutec.de
      # PDFIX-INTEGRATION (24.04.2026): Kill-Switch, default OFF. Fuer Staging auf true.
      - PDFIX_ENABLED=${PDFIX_ENABLED:-true}
      # PDFix-Lizenz (27.08.2026): aus .env.staging; leer = Testversion wie bisher
      - PDFIX_LICENSE_USER=${PDFIX_LICENSE_USER:-}
      - PDFIX_LICENSE_KEY=${PDFIX_LICENSE_KEY:-}
      # v3.7 (28.04.2026): Debug-Logging fuer Generator-Rohausgabe (Truncation-Audit)
      - DEBUG_GEN_RAW=${DEBUG_GEN_RAW:-true}
      # InkluAgent (Chatbot) — auf Staging default ON
      - INKLUAGENT_ENABLED=${INKLUAGENT_ENABLED:-true}
      - INKLUAGENT_BEDROCK_MODEL_TEXT=${INKLUAGENT_BEDROCK_MODEL_TEXT:-eu.anthropic.claude-sonnet-4-6}
      - INKLUAGENT_BEDROCK_MODEL_VISION=${INKLUAGENT_BEDROCK_MODEL_VISION:-eu.anthropic.claude-sonnet-4-6}
      - INKLUAGENT_INTENT_MODEL=${INKLUAGENT_INTENT_MODEL:-}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - INKLUAGENT_AGENTIC=${INKLUAGENT_AGENTIC:-false}
      # AWS Bedrock (08.05.2026): Anthropic Claude über Frankfurt fuer v4
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - BEDROCK_MODEL_CLASSIFY=eu.anthropic.claude-sonnet-4-6
      - BEDROCK_MODEL_INVENTAR=${BEDROCK_MODEL_INVENTAR:-eu.anthropic.claude-sonnet-4-6}
      - BEDROCK_MODEL_GENERATE=${BEDROCK_MODEL_GENERATE:-eu.anthropic.claude-sonnet-4-6}
      - BEDROCK_MODEL_VALIDATE=${BEDROCK_MODEL_VALIDATE:-eu.anthropic.claude-sonnet-4-6}
      # Anbieter je Rolle (07.09.2026): bedrock oder gemini; Rollen-Schalter optional (Kreuzmodell)
      - LLM_PROVIDER=${LLM_PROVIDER:-bedrock}
      - LLM_PROVIDER_CLASSIFY=${LLM_PROVIDER_CLASSIFY:-}
      - LLM_PROVIDER_INVENTAR=${LLM_PROVIDER_INVENTAR:-}
      - LLM_PROVIDER_GENERATE=${LLM_PROVIDER_GENERATE:-}
      - LLM_PROVIDER_VALIDATE=${LLM_PROVIDER_VALIDATE:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_ENDPOINT=${GEMINI_ENDPOINT:-https://generativelanguage.googleapis.com/v1beta}
      - GEMINI_MODEL_CLASSIFY=${GEMINI_MODEL_CLASSIFY:-gemini-3.8-flash}
      - GEMINI_MODEL_INVENTAR=${GEMINI_MODEL_INVENTAR:-gemini-3.1-pro-preview}
      - GEMINI_MODEL_GENERATE=${GEMINI_MODEL_GENERATE:-gemini-3.1-pro-preview}
      - GEMINI_MODEL_VALIDATE=${GEMINI_MODEL_VALIDATE:-gemini-3.1-pro-preview}
      - V4_VERIFY_MODE=kritisch
      - V4_VERIFY_KORREKTUR=on
      - V4_PROMPT_CACHE=${V4_PROMPT_CACHE:-off}  # Prompt-Caching 03.09.2026: Bilddaten ans Ende, fester Anfang mit cache_control (off = Prompts wie vorher)
      - ABO_ENFORCEMENT=${ABO_ENFORCEMENT:-off}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      # Anstoss des Abo-Tageslaufs von aussen (Cron), 10.08.2026
      - TAGESLAUF_TOKEN=${TAGESLAUF_TOKEN:-}
      # Barrierefreie PDF aus Word (29.08.2026): Umwandler-Dienst im Compose-Netz
      - KONVERTER_URL=http://inkludocs-konverter:8090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - inklucut_default

  # Umwandler (29.08.2026): LibreOffice + veraPDF, nur im Compose-Netz erreichbar,
  # kein Port nach aussen, keine Volumes (jeder Lauf raeumt sich selbst auf).
  inkludocs-konverter:
    build: ./konverter
    container_name: inkludocs-konverter-staging
    restart: unless-stopped
    networks:
      - default

volumes:
  inkludocs_staging_data:
    # Bestehendes Volume aus der Zeit vor der Projekt-Umbenennung weiternutzen.
    # external: true = Compose referenziert es nur (legt es nicht neu an und
    # loescht es nie), daher kein neues leeres Volume und keine Projekt-Label-
    # Warnung. Der reale Volume-Name bleibt inkludocs_inkludocs_staging_data.
    external: true
    name: inkludocs_inkludocs_staging_data

networks:
  inklucut_default:
    external: true
