# ─────────────────────────────────────────────────────────────────────────────
# InkluDocs — Demo-Instanz (öffentliche „Kostprobe" ohne Anmeldung)
# ─────────────────────────────────────────────────────────────────────────────
# Dritte, vollständig isolierte Instanz neben Production (docker-compose.yml) und
# Staging (docker-compose.staging.yml). Sie fährt DENSELBEN Code, aber:
#   • eigene Wegwerf-Datenbank (Volume inkludocs_demo_data) — getrennt von Prod/Staging
#   • eigener Port 127.0.0.1:8003 (nur lokal; öffentlich erst über NPM, wenn freigegeben)
#   • DEMO_MODE=on — schaltet den öffentlichen, anmeldefreien Demo-Pfad samt Limits
#     und der thematischen Bot-Leitplanke frei (Code dazu ab Schritt 2/3).
#
# Bedienung über den Wrapper:   ./compose-demo.sh up -d --build
# Architektur + Hintergrund:    siehe DEMO.md
#
# WICHTIG: Diese Datei enthält KEINE Geheimnisse. Secrets (AWS/Bedrock, SMTP, …)
# kommen ausschließlich aus .env.demo (chmod 600, nicht in Git). Demo-SPEZIFISCHE
# Schalter (BASE_URL, DEMO_MODE, Limits, Registrierung aus) sind hier hart gesetzt,
# damit das Verhalten der Demo versioniert und auf einen Blick nachvollziehbar ist.
#
# Eigener Compose-PROJEKTNAME (name: inkludocs-demo): Production und Staging teilen
# den Default-Projektnamen „inkludocs". Die Demo bekommt bewusst einen eigenen —
# dadurch ist sie ein vollständig getrenntes Compose-Projekt (keine „orphan"-
# Kopplung; ein versehentliches `--remove-orphans` kann Prod/Staging nicht treffen).
# ─────────────────────────────────────────────────────────────────────────────
name: inkludocs-demo

services:
  inkludocs-demo:
    image: inkludocs:demo-20260910  # 10.09.2026: Chatbot Gemini (Flash), Chat-Pruefung, Kontext-Fix, SEPA-Regel
    container_name: inkludocs-demo
    restart: unless-stopped
    ports:
      # Nur an localhost gebunden — von außen NICHT erreichbar, bis ein
      # NPM-Proxy-Host für demo.inkludocs.de eingerichtet wird (Schritt 6).
      - "127.0.0.1:8003:8001"
    volumes:
      # Eigene Wegwerf-DB. Bewusst getrennt von inkludocs_data (Prod) und
      # inkludocs_staging_data (Staging) — anonymer Traffic berührt nie echte Daten.
      - inkludocs_demo_data:/app/data
    environment:
      # ── Demo-spezifische Schalter (hart gesetzt, versioniert) ────────────────
      # Master-Schalter der Demo. Aktiviert ab Schritt 2/3: öffentlicher
      # Endpunkt ohne Login, Wegwerf-Projekte, Limits, Bot-Leitplanke.
      - DEMO_MODE=on
      # In der Demo registriert sich niemand — der Weg zum Konto führt zur echten App.
      - REGISTRATION_ENABLED=false
      - CREATE_DEFAULT_ADMIN=false   # 18.08.2026 Fable 5: Demo hat keinen Admin-Login
      # Abo-Enforcement in der Demo HART aus (eigene Wegwerf-DB, bewusst ohne Abo-Zaehlung) —
      # hart statt ${...:-off}, weil die Demo-Schalter hier versioniert festgeschrieben sind.
      - ABO_ENFORCEMENT=off
      # Limits — Werte hier dokumentiert; WIRKSAM ab Schritt 3 (dann liest der Code sie).
      - DEMO_DAILY_IMAGE_LIMIT=${DEMO_DAILY_IMAGE_LIMIT:-3}      # Generierungen/Tag pro Besucher
      - DEMO_DAILY_CHAT_LIMIT=${DEMO_DAILY_CHAT_LIMIT:-12}       # Chat-Nachrichten/Tag pro Besucher
      - DEMO_GLOBAL_DAILY_LIMIT=${DEMO_GLOBAL_DAILY_LIMIT:-300}  # globaler Tagesdeckel (Kostenschutz)

      # ── Ab hier identisch zu Staging: Pipeline-/Agent-Konfiguration ──────────
      # Werte stammen aus .env.demo (= Kopie von .env.prod), damit Generierung und
      # Chatbot exakt wie in der Produktion laufen (Bedrock/Claude Sonnet).
      - PDF_LANGBESCHREIBUNG=${PDF_LANGBESCHREIBUNG:-off}
      - SECRET_KEY=${SECRET_KEY:-inkludocs-demo-key-2026}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - NOTIFICATION_EMAIL=support@inklutec.de
      # Demo-eigene Basis-URL (hart gesetzt, wie bei Staging).
      - BASE_URL=https://demo.inkludocs.de
      - PDFIX_ENABLED=${PDFIX_ENABLED:-true}
      - DEBUG_GEN_RAW=${DEBUG_GEN_RAW:-false}
      - INKLUAGENT_ENABLED=${INKLUAGENT_ENABLED:-true}
      - INKLUAGENT_BEDROCK_MODEL_TEXT=${INKLUAGENT_BEDROCK_MODEL_TEXT:-eu.anthropic.claude-sonnet-4-6}
      - INKLUAGENT_BEDROCK_MODEL_VISION=${INKLUAGENT_BEDROCK_MODEL_VISION:-eu.anthropic.claude-sonnet-4-6}
      - INKLUAGENT_INTENT_MODEL=${INKLUAGENT_INTENT_MODEL:-}
      # Chatbot-Anbieter (10.09.2026): bedrock (Vorgabe) oder gemini
      - INKLUAGENT_PROVIDER=${INKLUAGENT_PROVIDER:-bedrock}
      - INKLUAGENT_VERIFY=${INKLUAGENT_VERIFY:-on}
      - ABLAGE_WORD=${ABLAGE_WORD:-off}   # Word-Dateien zusaetzlich in die Ablage (Steve 11.09.: aus)
      - KOSTEN_PRO_CREDIT_EUR=${KOSTEN_PRO_CREDIT_EUR:-0.012}
      - INKLUAGENT_GEMINI_MODEL_TEXT=${INKLUAGENT_GEMINI_MODEL_TEXT:-gemini-3.1-pro-preview}
      - INKLUAGENT_GEMINI_MODEL_VISION=${INKLUAGENT_GEMINI_MODEL_VISION:-gemini-3.1-pro-preview}
      - INKLUAGENT_GEMINI_THINKING=${INKLUAGENT_GEMINI_THINKING:-}
      - INKLUAGENT_GEMINI_TEMPERATURE=${INKLUAGENT_GEMINI_TEMPERATURE:-1.0}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - INKLUAGENT_AGENTIC=${INKLUAGENT_AGENTIC:-false}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - BEDROCK_MODEL_CLASSIFY=${BEDROCK_MODEL_CLASSIFY:-eu.anthropic.claude-haiku-4-5}
      - BEDROCK_MODEL_INVENTAR=${BEDROCK_MODEL_INVENTAR:-eu.anthropic.claude-sonnet-4-6}
      - BEDROCK_MODEL_GENERATE=${BEDROCK_MODEL_GENERATE:-eu.anthropic.claude-sonnet-4-6}
      - BEDROCK_MODEL_VALIDATE=${BEDROCK_MODEL_VALIDATE:-eu.anthropic.claude-sonnet-4-6}
      - V4_VERIFY_MODE=${V4_VERIFY_MODE:-off}
      - V4_VERIFY_KORREKTUR=${V4_VERIFY_KORREKTUR:-off}
      # Anbieter je Rolle (09.09.2026, wie Prod): Werte aus .env.demo; Vorgabe bedrock als Rueckfall.
      - LLM_PROVIDER=${LLM_PROVIDER:-bedrock}
      - LLM_PROVIDER_CLASSIFY=${LLM_PROVIDER_CLASSIFY:-}
      - LLM_PROVIDER_INVENTAR=${LLM_PROVIDER_INVENTAR:-}
      - LLM_PROVIDER_GENERATE=${LLM_PROVIDER_GENERATE:-}
      - LLM_PROVIDER_VALIDATE=${LLM_PROVIDER_VALIDATE:-}
      - GEMINI_AUTH=${GEMINI_AUTH:-vertex}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - VERTEX_PROJECT=${VERTEX_PROJECT:-}
      - VERTEX_REGION=${VERTEX_REGION:-global}
      - VERTEX_REGION_MAP=${VERTEX_REGION_MAP:-}
      - GOOGLE_SERVICE_ACCOUNT_JSON_B64=${GOOGLE_SERVICE_ACCOUNT_JSON_B64:-}
      - GEMINI_MODEL_CLASSIFY=${GEMINI_MODEL_CLASSIFY:-gemini-3.8-flash}
      - GEMINI_MODEL_INVENTAR=${GEMINI_MODEL_INVENTAR:-gemini-3.1-pro-preview}
      - GEMINI_MODEL_GENERATE=${GEMINI_MODEL_GENERATE:-gemini-3.1-pro-preview}
      - GEMINI_MODEL_VALIDATE=${GEMINI_MODEL_VALIDATE:-gemini-3.1-pro-preview}
      - V4_ZAEHL_PASS=${V4_ZAEHL_PASS:-off}
      - V4_DIAGRAMM_WERTE=${V4_DIAGRAMM_WERTE:-off}
      - V4_FAKTENBLATT=${V4_FAKTENBLATT:-off}
      - V4_PROMPT_CACHE=${V4_PROMPT_CACHE:-off}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - inklucut_default

volumes:
  inkludocs_demo_data:

networks:
  inklucut_default:
    external: true
